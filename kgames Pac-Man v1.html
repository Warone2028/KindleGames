<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kindle Pac-Man v1</title>
<!--
  Kindle Pac-Man v1 — a Pac-Man style maze game written in plain ES5 for the Kindle browser.
  Classic 28 x 31 maze, four ghosts with their own chase styles, power pellets, levels.
  Black and white, big buttons (or swipe on the board), speed choices, and the game keeps
  real time even when the screen redraws slowly.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Georgia, "Times New Roman", serif; font-size: 18px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 2px 6px; }
  .top { text-align: center; font-size: 20px; font-weight: bold; margin: 0 0 2px; }
  table.hud { width: 100%; border-collapse: collapse; }
  table.hud td { text-align: center; font-size: 18px; padding: 1px; }
  table.hud b { font-size: 19px; }
  canvas { display: block; margin: 2px auto; background: #fff; touch-action: none; }
  .row { text-align: center; margin: 4px 0; white-space: nowrap; }
  .lbl { font-size: 18px; font-weight: bold; margin-right: 4px; }
  button { font-family: inherit; font-weight: bold; background: #fff; color: #000; border: 3px solid #000; border-radius: 8px; margin: 0 2px; padding: 0; touch-action: none; }
  button.on { background: #000; color: #fff; }
  .sp { font-size: 18px; width: 14.5%; height: 42px; margin: 0 1px; }
  .ctl { font-size: 18px; width: 31%; height: 42px; }
  .pad { font-size: 20px; height: 60px; width: 23.5%; margin: 0 1px; }
  .msg { text-align: center; font-size: 18px; min-height: 22px; margin: 1px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="title">Kindle Pac-Man v1</div>
  <table class="hud" id="hud"><tr>
    <td>Score <b id="score">0</b></td>
    <td>Lives <b id="lives">3</b></td>
    <td>Level <b id="level">1</b></td>
    <td>Best <b id="best">0</b></td>
  </tr></table>

  <canvas id="game" width="560" height="620"></canvas>
  <div class="msg" id="message">Eat every dot. Big dots let you eat the ghosts.</div>

  <div class="row" id="pads">
    <button class="pad" data-dir="left">Left</button><button class="pad" data-dir="up">Up</button><button class="pad" data-dir="down">Down</button><button class="pad" data-dir="right">Right</button>
  </div>
  <div class="row" id="ctls">
    <button class="ctl" id="start">Start</button>
    <button class="ctl" id="restart">New game</button>
  </div>
  <div class="row" id="speeds">
    <span class="lbl">Speed</span>
    <button class="sp" data-speed="0.5">50%</button><button class="sp" data-speed="0.75">75%</button><button class="sp" data-speed="1">100%</button><button class="sp" data-speed="1.5">150%</button><button class="sp" data-speed="2">200%</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var MAZE_SRC = [
    "############################",
    "#............##............#",
    "#.####.#####.##.#####.####.#",
    "#o####.#####.##.#####.####o#",
    "#.####.#####.##.#####.####.#",
    "#..........................#",
    "#.####.##.########.##.####.#",
    "#.####.##.########.##.####.#",
    "#......##....##....##......#",
    "######.##### ## #####.######",
    "     #.##### ## #####.#     ",
    "     #.##          ##.#     ",
    "     #.## ###--### ##.#     ",
    "######.## #      # ##.######",
    "      .   #      #   .      ",
    "######.## #      # ##.######",
    "     #.## ######## ##.#     ",
    "     #.##          ##.#     ",
    "     #.## ######## ##.#     ",
    "######.## ######## ##.######",
    "#............##............#",
    "#.####.#####.##.#####.####.#",
    "#.####.#####.##.#####.####.#",
    "#o..##.......  .......##..o#",
    "###.##.##.########.##.##.###",
    "###.##.##.########.##.##.###",
    "#......##....##....##......#",
    "#.##########.##.##########.#",
    "#.##########.##.##########.#",
    "#..........................#",
    "############################"
  ];
  var COLS = 28, ROWS = 31, T = 20, TUNNEL_ROW = 14;
  var DIRS = { up: [0, -1], left: [-1, 0], down: [0, 1], right: [1, 0] };
  var ORDER = ['up', 'left', 'down', 'right'];
  var OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  var STEP = 1000 / 60;
  var MODES = [['scatter', 420], ['chase', 1200], ['scatter', 420], ['chase', 1200], ['scatter', 300], ['chase', 1200], ['scatter', 300], ['chase', 1e12]];

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var el = function (id) { return document.getElementById(id); };
  var scoreEl = el('score'), livesEl = el('lives'), levelEl = el('level'), bestEl = el('best');
  var messageEl = el('message'), startEl = el('start'), restartEl = el('restart');

  var maze, dotsLeft, dotsEaten, pac, ghosts, score, lives, level, running, over;
  var modeIdx, modeTime, frightTime, combo, ready, levelSteps, deathWait;
  var speed = 1, best = 0, acc = 0, last = 0, wallCanvas = null;

  function store(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function now() { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); }

  function cell(x, y) {
    if (y < 0 || y >= ROWS) return '#';
    if (x < 0 || x >= COLS) return y === TUNNEL_ROW ? ' ' : '#';
    return maze[y][x];
  }
  function openFor(x, y, who) {
    var c = cell(x, y);
    if (c === '#') return false;
    if (c === '-') return who !== pac && (who.state === 'leaving' || who.state === 'eyes' || who.state === 'entering');
    return true;
  }

  // ---- setup ----
  function loadMaze() {
    var y, x, row;
    maze = []; dotsLeft = 0;
    for (y = 0; y < ROWS; y++) {
      row = [];
      for (x = 0; x < COLS; x++) {
        row.push(MAZE_SRC[y].charAt(x));
        if (row[x] === '.' || row[x] === 'o') dotsLeft++;
      }
      maze.push(row);
    }
    dotsEaten = 0;
  }

  function makeGhost(name, letter, x, y, state, corner, release) {
    return { name: name, letter: letter, x: x, y: y, sx: x, sy: y, dir: 'left', state: state, startState: state,
             fright: false, rev: false, corner: corner, release: release };
  }

  function resetPositions() {
    pac = { x: 13, y: 23, dir: 'left', want: 'left', moving: true };
    ghosts = [
      makeGhost('blinky', 'B', 13, 11, 'out', [25, -3], 0),
      makeGhost('pinky', 'P', 13, 14, 'house', [2, -3], 60),
      makeGhost('inky', 'I', 11, 14, 'house', [27, 33], 300),
      makeGhost('clyde', 'C', 15, 14, 'house', [0, 33], 600)
    ];
    modeIdx = 0; modeTime = 0; frightTime = 0; combo = 0; levelSteps = 0;
    ready = 90; deathWait = 0;
  }

  function newLevel() { loadMaze(); resetPositions(); }

  function newGame() {
    score = 0; lives = 3; level = 1; over = false; running = false; acc = 0;
    newLevel();
    scoreEl.innerHTML = '0'; livesEl.innerHTML = '3'; levelEl.innerHTML = '1';
    startEl.innerHTML = 'Start';
    messageEl.innerHTML = 'Eat every dot. Big dots let you eat the ghosts.';
    draw();
  }

  // ---- movement along the maze grid ----
  function advance(e, dist, choose) {
    var guard = 0;
    while (dist > 1e-9 && guard++ < 10) {
      var cx = Math.round(e.x), cy = Math.round(e.y);
      if (Math.abs(e.x - cx) < 1e-6 && Math.abs(e.y - cy) < 1e-6) {
        e.x = cx; e.y = cy;
        if (!choose(e, cx, cy)) return;
      }
      var d = DIRS[e.dir], tx = e.x, ty = e.y;
      if (d[0] > 0) tx = Math.floor(e.x + 1e-9) + 1; else if (d[0] < 0) tx = Math.ceil(e.x - 1e-9) - 1;
      if (d[1] > 0) ty = Math.floor(e.y + 1e-9) + 1; else if (d[1] < 0) ty = Math.ceil(e.y - 1e-9) - 1;
      var gap = Math.abs(tx - e.x) + Math.abs(ty - e.y), m = Math.min(gap, dist);
      e.x += d[0] * m; e.y += d[1] * m; dist -= m;
      if (m >= gap - 1e-9) {
        e.x = tx; e.y = ty;
        if (e.x < 0) e.x = COLS - 1; else if (e.x > COLS - 1) e.x = 0;   // tunnel
        if (e === pac) eatAt(e.x, e.y);
      }
    }
  }

  function pacChoose(p, x, y) {
    var w = DIRS[p.want];
    if (p.want && openFor(x + w[0], y + w[1], p)) { p.dir = p.want; p.moving = true; return true; }
    var d = DIRS[p.dir];
    if (openFor(x + d[0], y + d[1], p)) { p.moving = true; return true; }
    p.moving = false; return false;
  }

  function targetFor(g) {
    if (g.state === 'leaving') return [13, 11];
    if (g.state === 'eyes') return [13, 11];
    if (g.state === 'entering') return [13, 14];
    var mode = MODES[modeIdx][0];
    if (mode === 'scatter') return g.corner;
    var px = Math.round(pac.x), py = Math.round(pac.y), pd = DIRS[pac.dir];
    if (g.name === 'blinky') return [px, py];
    if (g.name === 'pinky') return [px + pd[0] * 4, py + pd[1] * 4];
    if (g.name === 'inky') {
      var b = ghosts[0], ax = px + pd[0] * 2, ay = py + pd[1] * 2;
      return [ax * 2 - Math.round(b.x), ay * 2 - Math.round(b.y)];
    }
    var dx = px - g.x, dy = py - g.y;
    return (dx * dx + dy * dy > 64) ? [px, py] : g.corner;
  }

  function ghostChoose(g, x, y) {
    if (g.state === 'eyes' && x === 13 && y === 11) { g.state = 'entering'; }
    if (g.state === 'entering' && x === 13 && y === 14) { g.state = 'leaving'; g.fright = false; }
    if (g.state === 'leaving' && y <= 11 && (x === 13 || x === 14)) { g.state = 'out'; }

    var opts = [], i, dname, d;
    if (g.rev && g.state === 'out') {
      g.rev = false;
      d = DIRS[OPP[g.dir]];
      if (openFor(x + d[0], y + d[1], g)) { g.dir = OPP[g.dir]; return true; }
    }
    g.rev = false;
    var noReverse = g.state === 'out' || g.state === 'eyes';
    for (i = 0; i < 4; i++) {
      dname = ORDER[i]; d = DIRS[dname];
      if (noReverse && dname === OPP[g.dir]) continue;
      if (openFor(x + d[0], y + d[1], g)) opts.push(dname);
    }
    if (!opts.length) {
      d = DIRS[OPP[g.dir]];
      if (openFor(x + d[0], y + d[1], g)) { g.dir = OPP[g.dir]; return true; }
      return false;
    }
    if (g.fright && g.state === 'out') { g.dir = opts[Math.floor(Math.random() * opts.length)]; return true; }
    var t = targetFor(g), bestD = 1e9, pick = opts[0];
    for (i = 0; i < opts.length; i++) {
      d = DIRS[opts[i]];
      var ex = x + d[0] - t[0], ey = y + d[1] - t[1], dd = ex * ex + ey * ey;
      if (dd < bestD) { bestD = dd; pick = opts[i]; }
    }
    g.dir = pick;
    return true;
  }

  function eatAt(x, y) {
    var c = cell(x, y);
    if (c === '.' || c === 'o') {
      maze[y][x] = ' ';
      dotsLeft--; dotsEaten++;
      if (c === '.') addScore(10);
      else {
        addScore(50);
        frightTime = Math.max(120, 360 - (level - 1) * 60);
        combo = 0;
        for (var i = 0; i < ghosts.length; i++) {
          var g = ghosts[i];
          if (g.state !== 'eyes' && g.state !== 'entering') { g.fright = true; g.rev = true; }
        }
      }
    }
  }

  function addScore(n) {
    var before = score;
    score += n; scoreEl.innerHTML = String(score);
    if (before < 10000 && score >= 10000) { lives++; livesEl.innerHTML = String(lives); messageEl.innerHTML = 'Extra life!'; }
    if (score > best) { best = score; bestEl.innerHTML = String(best); store('kpac_best', String(best)); }
  }

  function lvl() { return Math.min(1.25, 1 + (level - 1) * 0.05); }

  function ghostSpeed(g) {
    if (g.state === 'eyes' || g.state === 'entering') return 0.25;
    if (g.state === 'leaving' || g.state === 'house') return 0.07;
    if (Math.round(g.y) === TUNNEL_ROW && (g.x <= 5 || g.x >= 22)) return 0.06;
    if (g.fright) return 0.07;
    return 0.117 * lvl();
  }

  // ---- one 60th of a second of play ----
  function update() {
    var i, g;
    if (deathWait > 0) {
      deathWait--;
      if (deathWait === 0) {
        if (lives <= 0) { running = false; over = true; startEl.innerHTML = 'Start'; messageEl.innerHTML = 'Game over! Score ' + score + '. Tap New game.'; }
        else { resetPositions(); messageEl.innerHTML = 'Ready!'; }
      }
      return;
    }
    if (ready > 0) { ready--; if (ready === 0) messageEl.innerHTML = 'Go!'; return; }

    levelSteps++;
    if (frightTime > 0) {
      frightTime--;
      if (frightTime === 0) for (i = 0; i < ghosts.length; i++) ghosts[i].fright = false;
    } else {
      modeTime++;
      if (modeTime >= MODES[modeIdx][1] && modeIdx < MODES.length - 1) {
        modeIdx++; modeTime = 0;
        for (i = 0; i < ghosts.length; i++) if (ghosts[i].state === 'out') ghosts[i].rev = true;
      }
    }

    // let ghosts out of the house
    for (i = 1; i < ghosts.length; i++) {
      g = ghosts[i];
      if (g.state === 'house' && (levelSteps >= g.release || (i === 2 && dotsEaten >= 30) || (i === 3 && dotsEaten >= 60))) g.state = 'leaving';
    }

    if (pac.moving || pac.want) advance(pac, 0.125 * lvl(), pacChoose);
    for (i = 0; i < ghosts.length; i++) {
      g = ghosts[i];
      if (g.state !== 'house') advance(g, ghostSpeed(g), ghostChoose);
    }
    checkHits();

    if (dotsLeft === 0) {
      level++; levelEl.innerHTML = String(level);
      messageEl.innerHTML = 'Level ' + level + '!';
      newLevel();
    }
  }

  function checkHits() {
    for (var i = 0; i < ghosts.length; i++) {
      var g = ghosts[i];
      if (g.state === 'eyes' || g.state === 'entering' || g.state === 'house') continue;
      if (Math.abs(g.x - pac.x) + Math.abs(g.y - pac.y) < 0.8) {
        if (g.fright) {
          g.fright = false; g.state = 'eyes';
          combo++; addScore(100 * Math.pow(2, combo));
        } else {
          lives--; livesEl.innerHTML = String(Math.max(0, lives));
          messageEl.innerHTML = lives > 0 ? 'Caught! ' + lives + (lives === 1 ? ' life' : ' lives') + ' left.' : 'Caught!';
          deathWait = 60;
          return;
        }
      }
    }
  }

  // ---- drawing ----
  function buildWalls() {
    wallCanvas = document.createElement('canvas');
    wallCanvas.width = COLS * T; wallCanvas.height = ROWS * T;
    var w = wallCanvas.getContext('2d'), x, y;
    w.fillStyle = '#fff'; w.fillRect(0, 0, wallCanvas.width, wallCanvas.height);
    w.fillStyle = '#000';
    for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) {
      if (MAZE_SRC[y].charAt(x) === '#') w.fillRect(x * T + 3, y * T + 3, T - 6, T - 6);
    }
    // join neighbouring wall blocks so walls read as solid lines
    for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) {
      if (MAZE_SRC[y].charAt(x) !== '#') continue;
      if (x + 1 < COLS && MAZE_SRC[y].charAt(x + 1) === '#') w.fillRect(x * T + 3, y * T + 3, T, T - 6);
      if (y + 1 < ROWS && MAZE_SRC[y + 1].charAt(x) === '#') w.fillRect(x * T + 3, y * T + 3, T - 6, T);
      if (x + 1 < COLS && y + 1 < ROWS && MAZE_SRC[y].charAt(x + 1) === '#' && MAZE_SRC[y + 1].charAt(x) === '#' && MAZE_SRC[y + 1].charAt(x + 1) === '#') w.fillRect(x * T + 3, y * T + 3, T, T);
    }
    // ghost house door
    w.fillRect(13 * T, 12 * T + 8, 2 * T, 4);
  }

  function drawGhost(g) {
    var cx = g.x * T + T / 2, cy = g.y * T + T / 2, r = 9;
    var flashing = g.fright && frightTime < 120 && Math.floor(frightTime / 15) % 2 === 0;
    var solid = g.fright && !flashing;
    if (g.state !== 'eyes' && g.state !== 'entering') {
      ctx.beginPath();
      ctx.arc(cx, cy - 1, r, Math.PI, 0, false);
      ctx.lineTo(cx + r, cy + r);
      ctx.lineTo(cx + r / 2, cy + r - 4); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r / 2, cy + r - 4);
      ctx.lineTo(cx - r, cy + r); ctx.closePath();
      ctx.fillStyle = solid ? '#000' : '#fff'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke();
    }
    // eyes
    var d = DIRS[g.dir];
    ctx.fillStyle = solid ? '#fff' : '#000';
    ctx.fillRect(cx - 5 + d[0] * 2, cy - 4 + d[1] * 2, 3, 4);
    ctx.fillRect(cx + 2 + d[0] * 2, cy - 4 + d[1] * 2, 3, 4);
    if (g.state === 'eyes' || g.state === 'entering') {
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - 6, cy - 5, 5, 6); ctx.strokeRect(cx + 1, cy - 5, 5, 6);
    } else if (!g.fright) {
      ctx.font = 'bold 9px Arial, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(g.letter, cx, cy + 7);
    }
  }

  function draw() {
    var x, y, i, c;
    if (!wallCanvas) buildWalls();
    ctx.drawImage(wallCanvas, 0, 0);
    ctx.fillStyle = '#000';
    for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) {
      c = maze[y][x];
      if (c === '.') ctx.fillRect(x * T + 8, y * T + 8, 4, 4);
      else if (c === 'o') { ctx.beginPath(); ctx.arc(x * T + 10, y * T + 10, 7, 0, Math.PI * 2, false); ctx.fill(); }
    }
    // Pac-Man
    if (deathWait === 0 || deathWait > 30) {
      var px = pac.x * T + T / 2, py = pac.y * T + T / 2;
      var ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[pac.dir];
      var mouth = (pac.moving && Math.floor((pac.x + pac.y) * 2) % 2 === 0) ? 0.08 : 0.28;
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.arc(px, py, 9, ang + mouth * Math.PI, ang - mouth * Math.PI + Math.PI * 2, false);
      ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill();
    }
    for (i = 0; i < ghosts.length; i++) drawGhost(ghosts[i]);

    var label = '';
    if (!running) label = over ? 'GAME OVER' : (score || level > 1 || dotsEaten ? 'PAUSED' : 'TAP START');
    else if (ready > 0) label = 'READY!';
    if (label) {
      ctx.fillStyle = '#fff'; ctx.fillRect(9 * T, 17 * T - 2, 10 * T, T + 4);
      ctx.fillStyle = '#000'; ctx.font = 'bold 20px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText(label, 14 * T, 18 * T - 3);
    }
  }

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (f) { return window.setTimeout(function () { f(now()); }, 16); };

  function loop() {
    var t = now(), dt = t - last, steps = 0;
    last = t;
    if (dt > 500) dt = 500;
    if (running) {
      acc += dt * speed;
      while (acc >= STEP && running && steps < 120) { update(); acc -= STEP; steps++; }
      if (steps >= 120) acc = 0;
    }
    draw();
    raf(loop);
  }

  // ---- fit the board to the screen ----
  function fit() {
    var used = 0, ids = ['title', 'hud', 'message', 'pads', 'ctls', 'speeds'], i;
    for (i = 0; i < ids.length; i++) used += el(ids[i]).offsetHeight + 8;
    var availH = window.innerHeight - used - 6;
    var availW = canvas.parentNode.clientWidth - 12;
    var h = Math.max(200, Math.min(availH, availW * ROWS / COLS));
    canvas.style.height = Math.floor(h) + 'px';
    canvas.style.width = Math.floor(h * COLS / ROWS) + 'px';
  }

  // ---- controls ----
  function tapButton(btn, fn) {
    var touched = false;
    btn.addEventListener('touchstart', function (e) { e.preventDefault(); touched = true; fn(); }, false);
    btn.addEventListener('click', function () { if (touched) { touched = false; return; } fn(); }, false);
  }
  function begin() {
    if (over) return;
    running = true; acc = 0; last = now();
    startEl.innerHTML = 'Pause';
    if (ready > 0) messageEl.innerHTML = 'Ready!';
  }
  function turn(d) {
    pac.want = d;
    if (pac.moving && d === OPP[pac.dir]) pac.dir = d;   // turn back at once, like the arcade
    if (!running && !over) begin();
  }
  function setSpeed(s) {
    speed = s;
    var bs = document.querySelectorAll('button.sp'), i;
    for (i = 0; i < bs.length; i++) bs[i].className = 'sp' + (parseFloat(bs[i].getAttribute('data-speed')) === s ? ' on' : '');
    store('kpac_speed', String(s));
  }

  var pads = document.querySelectorAll('button[data-dir]'), i;
  for (i = 0; i < pads.length; i++) (function (b) { tapButton(b, function () { turn(b.getAttribute('data-dir')); }); })(pads[i]);
  var sps = document.querySelectorAll('button.sp');
  for (i = 0; i < sps.length; i++) (function (b) { tapButton(b, function () { setSpeed(parseFloat(b.getAttribute('data-speed'))); }); })(sps[i]);
  tapButton(restartEl, newGame);
  tapButton(startEl, function () {
    if (over) return;
    if (running) { running = false; startEl.innerHTML = 'Start'; messageEl.innerHTML = 'Paused. Tap Start to go on.'; }
    else begin();
  });

  var sx = null, sy = null;
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, false);
  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (sx === null) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 'right' : 'left'); else turn(dy > 0 ? 'down' : 'up');
  }, false);
  window.addEventListener('keydown', function (e) {
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Up: 'up', Down: 'down', Left: 'left', Right: 'right' };
    var k = map[e.key || ''];
    if (k) { e.preventDefault(); turn(k); }
  }, false);
  window.addEventListener('resize', fit, false);

  // test hooks
  window.KPAC = {
    state: function () { return { running: running, over: over, score: score, lives: lives, level: level, dotsLeft: dotsLeft, pac: pac, ghosts: ghosts, frightTime: frightTime, ready: ready }; },
    clearDotsBut: function (n) { var x, y; for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) if ((maze[y][x] === '.' || maze[y][x] === 'o') && dotsLeft > n) { maze[y][x] = ' '; dotsLeft--; } }
  };

  best = parseInt(load('kpac_best') || '0', 10) || 0; bestEl.innerHTML = String(best);
  var s = parseFloat(load('kpac_speed') || '1');
  setSpeed([0.5, 0.75, 1, 1.5, 2].indexOf(s) >= 0 ? s : 1);
  newGame();
  fit();
  last = now();
  raf(loop);
})();
</script>
