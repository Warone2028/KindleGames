    var si=g.pos[g.round];

function score(right,total){
  var g=S.g, pct=Math.round(100*right/total), won=pct>=80, p=prog(S.vi);
  if(won){ p[g.kind]=1; save(); }
  var name=g.kind==='mw'?'Missing word':g.kind==='po'?'Phrase order':'Spot the error';
  var h=bar('<button class="linkbtn" data-a="back">'+esc(V[S.vi].r)+'</button>','<span>'+name+'</span>');
  h+='<h1>'+(won?'Won':'Not yet')+'</h1>';
  h+= g.kind==='po' ? '<p>'+g.miss+' wrong tap'+(g.miss===1?'':'s')+'. Score '+pct+'%.</p>' : '<p>'+right+' of '+total+' right ('+pct+'%).</p>';
  h+='<p class="small">A win needs 80%.</p>';
  h+='<button class="btn dark" data-a="game" data-v="'+g.kind+'">Play again</button><button class="btn" data-a="back">Back to the verse</button>';
  app.innerHTML=h; window.scrollTo(0,0);
}

/* ---------- memorize ---------- */
function mem(show){
  var v=V[S.vi], p=prog(S.vi), lv=p.mem>=3?2:(p.mem||0), tk=tokens(v.x), h;
  h=bar('<button class="linkbtn" data-a="back">'+esc(v.r)+'</button>','<span>Memorize, step '+(lv+1)+' of 3</span>');
  h+='<div class="ref">'+esc(v.r)+'</div>';
  if(!show){
    var txt='', n=0;
    for(var i=0;i<tk.length;i++){ var t=tk[i], c;
      if(!t.word) c=esc(t.pre);
      else if(lv===0){ n++; c= (n%2===0) ? esc(t.pre)+'<span class="blank" style="min-width:'+(t.core.length*9)+'px">&nbsp;</span>'+esc(t.post) : esc(t.pre+t.core+t.post); }
      else if(lv===1){ c=esc(t.pre+t.core.charAt(0)+t.post); }
      else { c='<span class="blank" style="min-width:'+(t.core.length*9)+'px">&nbsp;</span>'; }
      txt+=c+' ';
    }
    var hint=['Every other word is hidden.','Only the first letter of each word.','Only blank lines.'][lv];
    h+='<p class="small">'+hint+' Say the whole verse aloud, then check it.</p><div class="verse" style="line-height:2">'+txt+'</div>';
    h+='<button class="btn dark" data-a="memshow">Show the verse</button>';
  } else {
    h+='<div class="verse">'+esc(v.x)+'</div><p class="small">Did you say it word for word?</p>';
    h+='<div class="row"><button class="btn" data-a="memno">Not yet</button><button class="btn dark" data-a="memyes">Word for word</button></div>';
  }
  app.innerHTML=h; window.scrollTo(0,0);
}
function memDone(){
  var v=V[S.vi], h=bar('<button class="linkbtn" data-a="back">'+esc(v.r)+'</button>','<span>Memorized</span>');
  h+='<h1>Memorized</h1><p>You said '+esc(v.r)+' word for word from blank lines.</p><button class="btn dark" data-a="back">Back to the verse</button><button class="btn" data-a="topic" data-v="'+esc(v.t)+'">Next verse</button>';
  app.innerHTML=h; window.scrollTo(0,0);
}

function handle(a,v,el){
  var x=0, g=S.g;
  if(a==='sthome') home();
  else if(a==='topic'){ S.topic=v; topic(); }
  else if(a==='verse'){ S.vi=+v; verse(); }
  else if(a==='back') verse();
  else if(a==='game') newGame(v);
  else if(a==='mwpick'){ if(g.picked!==null) return; g.picked=v; g.ok=(v.toLowerCase()===g.tk[g.pos[g.round]].core.toLowerCase()); if(g.ok) g.right++; play(); }
  else if(a==='tap'){ if(g.picked!==null) return; g.picked=+v; g.ok=(+v===g.pos[g.round]); if(g.ok) g.right++; play(); }
  else if(a==='nextround'){ g.round++; if(g.round>=g.rounds) score(g.right,g.rounds); else { prepRound(g); play(); } }
  else if(a==='popick'){ var pi=+v; if(pi===g.next){ g.next++; g.msg=''; if(g.next>=g.ph.length){ var tot=g.ph.length; return score(Math.max(0,tot-g.miss),tot); } } else { g.miss++; g.msg='Not next. Try another.'; } play(); }
  else if(a==='mem') mem(false);
  else if(a==='memshow') mem(true);
  else if(a==='memno') mem(false);
  else if(a==='memyes'){ var p=prog(S.vi); var lv=p.mem>=3?3:(p.mem||0); if(lv<3){ p.mem=lv+1; save(); } if(p.mem>=3) memDone(); else mem(false); }
};
