rounds('whichfirst','Which Came First?','Two Bible events are shown. Tap the one that happened first. Get 8 of 10 right to win.',function(){
  var a=G.rnd(L.tl.length),b;do{b=G.rnd(L.tl.length);}while(b===a);var first=Math.min(a,b),o=G.shuffle([a,b]);
  return {ask:'Which came first?',opts:[L.tl[o[0]][0],L.tl[o[1]][0]],right:o.indexOf(first),tell:L.tl[first][0]+' ('+L.tl[first][1]+') came before '+L.tl[Math.max(a,b)][0]+' ('+L.tl[Math.max(a,b)][1]+').'};},8);
rounds('otnt','Old Testament or New Testament?','A Bible book, person or event is shown. Tap Old Testament or New Testament. Get 8 of 10 right to win.',function(){
  var x;if(G.rnd(3)===0){var i=G.rnd(66);x=[BN[i],'book',i>=39];}else x=fresh(L.otnt,function(t){return t[0];});
  return {ask:esc(x[0])+' <span class="small">('+x[1]+')</span>',opts:['Old Testament','New Testament'],right:x[2]?1:0,tell:x[0]+' is in the '+(x[2]?'New':'Old')+' Testament.'};},8);
rounds('headlines','Bible Newspaper: Headline Challenge','Each headline reports a Bible event, newspaper style. Tap the event it is about. Get 8 of 10 right to win.',function(){
  var h=fresh(L.hl,function(t){return t[0];}),w=[],o=G.shuffle(L.hl.slice());for(var i=0;i<o.length&&w.length<3;i++)if(o[i][1]!==h[1])w.push(o[i][1]);
  return mc('&ldquo;'+esc(h[0])+'&rdquo;',h[1],w,'This is '+h[1]+' ('+h[2]+').');},8);
function challenge(id,name,how,list,total,need,ask){rounds(id,name,how,function(i){return ask?ask(i):qmc(fresh(list,MQ));},need,total);}
challenge('ch_complete','The Complete Bible Knowledge Challenge','Twenty questions from all through the Bible, Genesis to Revelation. Tap A, B, C or D. Get 15 right to win.',L.mill,20,15);
challenge('ch_history','The Great Biblical History Challenge','Twenty questions on Bible history: from Genesis through Esther, and the book of Acts. Get 15 right to win.',pool(function(m){return m.b<=16||m.b===43;}),20,15);
challenge('ch_teach','The Teachings of Jesus Challenge','Fifteen questions about what Jesus taught: His sayings, sermons and parables. Get 11 right to win.',L.teach,15,11);
var OTQ=pool(function(m){return !m.nt;}),NTQ=pool(function(m){return m.nt;});
challenge('ch_otnt','Old Testament vs. New Testament Challenge','Twenty questions that take turns: one from the Old Testament, then one from the New. Get 15 right to win.',null,20,15,function(i){var m=fresh(i%2?NTQ:OTQ,MQ),q=qmc(m);q.ask='<span class="small">'+(i%2?'New':'Old')+' Testament</span><br>'+q.ask;return q;});
challenge('ch_master','The Bible Master Challenge','The hardest test: 25 harder questions from the whole Bible. Get 20 right to become a Bible Master.',pool(function(m){return m.l>0;}),25,20);
G.HOW.ch_master+=' Questions come from the harder levels.';

/* ---------- Bible Word Connections: Advanced ---------- */
(function(){
var S,id='connections',name='Word Connections: Advanced';
function draw(){G.S=S;var h=G.bar(name,'groups found '+S.found.length+' of 4 &middot; mistakes '+S.miss+' of 4');
  for(var f=0;f<S.found.length;f++){var g=S.p[S.found[f]];h+='<div class="note"><b>'+esc(g[0])+':</b> '+esc(g[1].join(', '))+'</div>';}
  if(S.found.length===4)h+='<p class="note">You win! All four groups found with '+S.miss+' mistake'+(S.miss===1?'':'s')+'.</p><button class="btn dark" data-a="new">New puzzle</button>';
  else if(S.miss>=4){h+='<p class="note">Game over: four mistakes. The groups were:</p>';for(var k=0;k<4;k++)if(S.found.indexOf(k)<0)h+='<div class="note"><b>'+esc(S.p[k][0])+':</b> '+esc(S.p[k][1].join(', '))+'</div>';h+='<button class="btn dark" data-a="new">New puzzle</button>';}
  else{h+='<p class="small">Tap four words that belong together, then tap Check.</p><div class="row">';
    for(var i=0;i<S.words.length;i++){var w=S.words[i];if(S.done[w])continue;h+='<button class="btn'+(S.sel[w]?' on':'')+'" data-a="word" data-v="'+esc(w)+'">'+esc(w)+'</button>';}
    h+='</div><button class="btn dark" data-a="check">Check ('+S.n+' of 4 picked)</button>'+(S.msg?'<p class="note">'+esc(S.msg)+'</p>':'');}
  S.el.innerHTML=h;window.scrollTo(0,0);}
G.add({id:id,name:name,group:'Bible challenges',start:function(el){var p=G.pick(L.cn),w=[];for(var i=0;i<4;i++)w=w.concat(p[i][1]);S={el:el,p:p,words:G.shuffle(w),sel:{},n:0,done:{},found:[],miss:0,msg:''};draw();},
 click:function(a,v){if(a==='new'){this.start(S.el);return;}if(S.found.length===4||S.miss>=4)return;S.msg='';
  if(a==='word'){if(S.sel[v]){delete S.sel[v];S.n--;}else if(S.n<4){S.sel[v]=1;S.n++;}}
  else if(a==='check'){if(S.n<4)S.msg='Pick four words first.';else{var hit=-1,best=0;
    for(var g=0;g<4;g++){var c=0;for(var j=0;j<4;j++)if(S.sel[S.p[g][1][j]])c++;if(c===4)hit=g;if(c>best)best=c;}
    if(hit>=0){S.found.push(hit);for(var j2=0;j2<4;j2++)S.done[S.p[hit][1][j2]]=1;}else{S.miss++;S.msg=best===3?'One away!':'Those four do not go together.';}
    S.sel={};S.n=0;}}
  draw();}});
G.HOW[id]='Sixteen Bible words hide four groups of four. Tap four that belong together, then Check. You may make four mistakes. Find all four groups to win. Some words could fit more than one group, so think about the whole puzzle.';
})();
})();
(function(){var k=["millionaire", "millionaire_ot", "books66", "missingbook", "timeline", "scramble", "truefalse", "twotruths", "versematch", "detective", "millionaire_nt", "exodus", "whichfirst", "otnt", "headlines", "connections", "ch_complete", "ch_history", "ch_teach", "ch_otnt", "ch_master"],G=window.GS,o=[];for(var i=0;i<k.length;i++)for(var j=0;j<G.games.length;j++)if(G.games[j].id===k[i])o.push(G.games[j]);G.games=o;})();</script></body></html>
