 can escape, but the centurion stops them to save you."], "v": [["Acts 27:41", "And falling into a place where two seas met, they ran the ship aground; and the bow stuck fast, and remained unmovable, but the stern was broken with the violence of the waves."], ["Acts 27:43", "But the centurion, willing to save Paul, kept them from their purpose; and commanded that they who could swim should cast themselves first into the sea, and get to land:"]], "c": [{"t": "Swim or float to land on a board", "go": "island"}, {"t": "Stay on the breaking ship", "go": "w_stay"}]}, "w_stay": {"wrong": true, "t": ["Everyone made it to land: some by swimming, the rest on boards and broken pieces of the ship."], "v": [["Acts 27:44", "And the rest, some on boards, and some on broken pieces of the ship. And so it came to pass, that they escaped all safe to land."]], "back": "wreck"}, "island": {"t": ["All of you reach the island of Malta, and the people there build a fire for you. As you add sticks to it, a viper fastens on your hand."], "v": [["Acts 28:3", "And when Paul had gathered a bundle of sticks, and laid them on the fire, there came a viper out of the heat, and fastened on his hand."]], "c": [{"t": "Panic and run", "go": "w_panic"}, {"t": "Shake it off into the fire", "go": "end"}]}, "w_panic": {"wrong": true, "t": ["Paul did not panic."], "v": [["Acts 28:5", "And he shook off the creature into the fire, and felt no harm."]], "back": "island"}, "end": {"end": true, "t": ["You shake the viper off into the fire and feel no harm. God has kept every word He promised: not one life was lost."], "v": [["Acts 28:5", "And he shook off the creature into the fire, and felt no harm."], ["Acts 27:44", "And the rest, some on boards, and some on broken pieces of the ship. And so it came to pass, that they escaped all safe to land."]], "lesson": "I believe God, that it shall be even as it was told me."}}, "stats": [], "sol": [1, 0, 0, 1, 0, 0, 1]}, "adv_journeys": {"name": "Paul's Missionary Journeys", "start": "start", "stats": [["sup", "Supplies", 6], ["days", "Days to Pentecost", 6]], "wfx": {"sup": -1}, "lose": {"sup": {"t": "Your supplies ran out on the road. Each wrong turn cost you supplies. Plan your route by the Bible and try again.", "v": [["Philippians 4:19", "But my God shall supply all your need according to his riches in glory by Christ Jesus."]]}, "days": {"t": "You did not reach Jerusalem in time for Pentecost. Each wrong turn cost you a day.", "v": [["Acts 20:16", "For Paul had determined to sail past Ephesus, because he would not spend the time in Asia: for he hastened, if it were possible for him, to be at Jerusalem the day of Pentecost."]]}}, "how": "You are Paul. Choose where to go next. Every trip costs Supplies, and every wrong turn costs one more. Find ways to get more supplies the way Paul did. Near the end, race to Jerusalem before the Days run out. If Supplies or Days reach 0, it is game over.", "nodes": {"start": {"head": "First journey", "t": ["You are Saul, also called Paul, a teacher in the church at Antioch with Barnabas.", "While the church worships the Lord and fasts, the Holy Spirit speaks."], "v": [["Acts 13:2", "As they ministered to the Lord, and fasted, the Holy Spirit said, Separate me Barnabas and Saul for the work to which I have called them."]], "c": [{"t": "Set out with Barnabas as the Spirit says", "go": "cyprus", "fx": {"sup": -1}}, {"t": "Stay home in Antioch", "go": "w_stay"}]}, "w_stay": {"wrong": true, "t": ["They did not stay. The church prayed, laid hands on them, and sent them away."], "v": [["Acts 13:3", "And when they had fasted and prayed, and laid their hands on them, they sent them away."]], "back": "start"}, "cyprus": {"t": ["You sail to the island of Cyprus. At Paphos the ruler, Sergius Paulus, wants to hear the word of God.", "But a sorcerer named Elymas tries to turn him away from the faith."], "v": [["Acts 13:8", "But Elymas the magician (for so is his name translated) withstood them, seeking to turn away the deputy from the faith."]], "c": [{"t": "Give up on the ruler and leave", "go": "w_cyprus"}, {"t": "Rebuke the sorcerer, filled with the Holy Spirit", "go": "pisidia", "fx": {"sup": -1}}]}, "w_cyprus": {"wrong": true, "t": ["Paul did not give up. He rebuked the sorcerer, and the ruler believed."], "v": [["Acts 13:12", "Then the deputy, when he saw what was done, believed, being astonished at the doctrine of the Lord."]], "back": "cyprus"}, "pisidia": {"t": ["You travel on to Antioch in Pisidia and preach in the synagogue. Almost the whole city comes to hear.", "Some of the Jews are filled with envy and speak against you."], "v": [["Acts 13:45", "But when the Jews saw the multitudes, they were filled with envy, and spoke against those things which were spoken by Paul, contradicting and blaspheming."]], "c": [{"t": "Stop preaching to keep the peace", "go": "w_pisidia"}, {"t": "Turn to the Gentiles with the gospel", "go": "lystra"}]}, "w_pisidia": {"wrong": true, "t": ["Paul and Barnabas grew bold and turned to the Gentiles."], "v": [["Acts 13:46", "Then Paul and Barnabas grew bold, and said, It was necessary that the word of God should first have been spoken to you: but seeing you put it from you, and judge yourselves unworthy of everlasting life, lo, we turn to the Gentiles."]], "back": "pisidia"}, "lystra": {"t": ["At Lystra a man lame from birth is healed when you speak to him. The crowd shouts that the gods have come down, and the priest brings oxen to offer to you."], "v": [["Acts 14:11", "And when the people saw what Paul had done, they lifted up their voices, saying in the speech of Lycaonia, The gods are come down to us in the likeness of men."]], "c": [{"t": "Accept their honor", "go": "w_lystra"}, {"t": "Tear your clothes and point them to the living God", "go": "stoned"}]}, "w_lystra": {"wrong": true, "t": ["Paul and Barnabas ran in among the people and stopped them."], "v": [["Acts 14:15", "And saying, Sirs, why do you these things? We also are men of like passions with you, and preach unto you that you should turn from these vanities unto the living God, who made heaven, and earth, and the sea, and all things that are in them:"]], "back": "lystra"}, "stoned": {"t": ["Enemies come from Antioch and Iconium and turn the crowd. They stone you and drag you out of the city, thinking you are dead."], "v": [["Acts 14:19", "And there came there certain Jews from Antioch and Iconium, who persuaded the people, and, having stoned Paul, drew him out of the city, supposing he had been dead."]], "c": [{"t": "Run home and never come back", "go": "w_stoned"}, {"t": "Rise up, then go on to Derbe", "go": "home1", "fx": {"sup": -1}}]}, "w_stoned": {"wrong": true, "t": ["Paul rose up, went back into the city, and the next day went on to Derbe. Later he even returned to Lystra."], "v": [["Acts 14:20", "However, as the disciples stood round about him, he rose up, and came into the city: and the next day he departed with Barnabas to Derbe."], ["Acts 14:21", "And when they had preached the gospel to that city, and had taught many, they returned again to Lystra, and to Iconium, and Antioch,"]], "back": "stoned"}, "home1": {"t": ["You return through the cities, strengthening the believers, and sail home to Antioch. The church gathers to hear all that God has done.", "You rest there a long time, and the church refreshes you."], "v": [["Acts 14:27", "And when they were come, and had gathered the church together, they reported all that God had done with them, and how he had opened the door of faith unto the Gentiles."]], "c": [{"t": "Rest, then set out on a second journey with Silas", "go": "asia", "fx": {"sup": 2}}]}, "asia": {"head": "Second journey", "t": ["You visit the churches again. Now you want to preach in the province of Asia, and then in Bithynia."], "c": [{"t": "Go into Asia anyway", "go": "w_asia"}, {"t": "Try to go into Bithynia", "go": "w_bith"}, {"t": "Go down to Troas by the sea and wait", "go": "vision", "fx": {"sup": -1}}], "v": []}, "w_asia": {"wrong": true, "t": ["The Holy Spirit forbade them to preach in Asia at that time."], "v": [["Acts 16:6", "Now when they had gone throughout Phrygia and the region of Galatia, and were forbidden of the Holy Spirit to preach the word in Asia,"]], "back": "asia"}, "w_bith": {"wrong": true, "t": ["The Spirit did not let them go into Bithynia."], "v": [["Acts 16:7", "After they were come to Mysia, they attempted to go into Bithynia: but the Spirit permitted them not."]], "back": "asia"}, "vision": {"t": ["At Troas, a vision comes to you in the night."], "v": [["Acts 16:9", "And a vision appeared to Paul in the night; There stood a man of Macedonia, beseeching him, saying, Come over into Macedonia, and help us."]], "c": [{"t": "Wait to be sure", "go": "w_vision"}, {"t": "Set out for Macedonia at once", "go": "philippi", "fx": {"sup": -1}}]}, "w_vision": {"wrong": true, "t": ["They did not wait. They went at once, sure that the Lord had called them."], "v": [["Acts 16:10", "And after he had seen the vision, immediately we endeavored to go into Macedonia, concluding that the Lord had called us to preach the gospel unto them."]], "back": "vision"}, "philippi": {"t": ["At Philippi, on the sabbath, you speak to women by the river. A seller of purple named Lydia believes, and she and her house are baptized.", "She begs you to stay at her house."], "v": [["Acts 16:14", "And a certain woman named Lydia, a seller of purple, of the city of Thyatira, who worshiped God, heard us: whose heart the Lord opened, so that she attended unto the things which were spoken by Paul."]], "c": [{"t": "Stay at her house", "go": "jail", "fx": {"sup": 2}}, {"t": "Refuse and sleep outside", "go": "w_lydia"}]}, "w_lydia": {"wrong": true, "t": ["Lydia urged them, and they stayed."], "v": [["Acts 16:15", "And when she was baptized, and her household, she besought us, saying, If you have judged me to be faithful to the Lord, come into my house, and abide there. And she prevailed upon us."]], "back": "philippi"}, "jail": {"t": ["You cast an evil spirit out of a slave girl. Her masters are angry. You and Silas are beaten and locked in the inner prison with your feet in the stocks.", "It is midnight."], "c": [{"t": "Pray and sing praises to God", "go": "quake"}, {"t": "Complain about the pain", "go": "w_jail"}], "v": []}, "w_jail": {"wrong": true, "t": ["Paul and Silas prayed and sang praises, and the prisoners heard them."], "v": [["Acts 16:25", "And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them."]], "back": "jail"}, "quake": {"t": ["A great earthquake shakes the prison. Every door opens and every chain falls off. The jailer wakes, sees the doors open, and draws his sword to kill himself."], "v": [["Acts 16:26", "And suddenly there was a great earthquake, so that the foundations of the prison were shaken: and immediately all the doors were opened, and every one’s bands were loosed."]], "c": [{"t": "Escape while you can", "go": "w_quake"}, {"t": "Cry out to stop him", "go": "saved"}]}, "w_quake": {"wrong": true, "t": ["Paul did not run. He called out to save the jailer."], "v": [["Acts 16:28", "But Paul cried with a loud voice, saying, Do yourself no harm: for we are all here."]], "back": "quake"}, "saved": {"t": ["The jailer falls down trembling and asks what he must do to be saved."], "v": [["Acts 16:31", "And they said, Believe on the Lord Jesus Christ, and you shall be saved, and your house."]], "c": [{"t": "Go on to Thessalonica and Berea", "go": "athens", "fx": {"sup": -1}}]}, "athens": {"t": ["In Thessalonica a mob drives you out. The believers of Berea search the Scriptures every day. Then you come to Athens, a city full of idols.", "You find an altar with the words: TO THE UNKNOWN GOD."], "v": [["Acts 17:23", "For as I passed by, and beheld your devotions, I found an altar with this inscription, TO THE UNKNOWN GOD. Whom therefore you ignorantly worship, him declare I unto you."]], "c": [{"t": "Mock their idols", "go": "w_athens"}, {"t": "Tell them about the God they do not know", "go": "corinth", "fx": {"sup": -1}}]}, "w_athens": {"wrong": true, "t": ["Paul spoke wisely. He began where they were and told them about the God who made the world."], "v": [["Acts 17:24", "God that made the world and all things therein, seeing that he is Lord of heaven and earth, dwells not in temples made with hands;"]], "back": "athens"}, "corinth": {"t": ["You reach Corinth with almost nothing left. There you meet Aquila and Priscilla, who make tents, just as you do."], "c": [{"t": "Ask the church to pay your way", "go": "w_corinth"}, {"t": "Work with them making tents", "go": "corinth2", "fx": {"sup": 3}}], "v": []}, "w_corinth": {"wrong": true, "t": ["Paul worked with his own hands so that no one could say he preached for money."], "v": [["Acts 18:3", "And because he was of the same craft, he abode with them, and worked: for by their occupation they were tentmakers."], ["Acts 20:34", "Yea, you yourselves know, that these hands have ministered unto my necessities, and to them that were with me."]], "back": "corinth"}, "corinth2": {"t": ["Many in Corinth believe. Then the Lord speaks to you in a vision by night."], "v": [["Acts 18:9", "Then spoke the Lord to Paul in the night by a vision, Be not afraid, but speak, and hold not your peace:"], ["Acts 18:10", "For I am with you, and no man shall set on you to hurt you: for I have many people in this city."]], "c": [{"t": "Stay and teach in Corinth", "go": "ephesus", "fx": {"sup": -1}}, {"t": "Leave because you are afraid", "go": "w_corinth2"}]}, "w_corinth2": {"wrong": true, "t": ["Paul stayed and taught the word of God there for a year and six months."], "v": [["Acts 18:11", "And he continued there a year and six months, teaching the word of God among them."]], "back": "corinth2"}, "ephesus": {"head": "Third journey", "t": ["You teach in Ephesus for two years. Those who used magic burn their books in front of everyone.", "Then the silversmiths, who make shrines for the goddess Diana, start a riot. The crowd rushes into the theater."], "v": [["Acts 19:28", "And when they heard these sayings, they were full of wrath, and cried out, saying, Great is Diana of the Ephesians."]], "c": [{"t": "Rush into the theater to speak", "go": "w_ephesus"}, {"t": "Listen to the believers and stay out", "go": "troas2", "fx": {"sup": -1}}]}, "w_ephesus": {"wrong": true, "t": ["Paul wanted to go in, but the disciples would not let him."], "v": [["Acts 19:30", "And when Paul would have entered in unto the people, the disciples allowed him not."]], "back": "ephesus"}, "troas2": {"head": "The race to Pentecost", "t": ["You want to be in Jerusalem by the day of Pentecost. Every day counts now.", "At Troas you preach until midnight. A young man named Eutychus falls asleep and falls from the third floor. He is taken up dead."], "v": [["Acts 20:9", "And there sat in a window a certain young man named Eutychus, being fallen into a deep sleep: and as Paul was long preaching, he sunk down with sleep, and fell down from the third loft, and was taken up dead."]], "wfx": {"days": -1}, "c": [{"t": "Leave him to the others and hurry on", "go": "w_eut"}, {"t": "Go down and embrace him", "go": "miletus", "fx": {"days": -1}}]}, "w_eut": {"wrong": true, "t": ["Paul went down, embraced him, and said that his life was in him."], "v": [["Acts 20:10", "And Paul went down, and fell upon him, and embracing him said, Trouble not yourselves; for his life is in him."]], "back": "troas2"}, "miletus": {"t": ["You walk to Assos and sail on. Ahead is the port for Ephesus, where you have so many friends."], "wfx": {"days": -1}, "c": [{"t": "Stop at Ephesus to visit everyone", "go": "w_miletus"}, {"t": "Sail past Ephesus and call the elders to Miletus", "go": "tyre", "fx": {"days": -1}}], "v": []}, "w_miletus": {"wrong": true, "t": ["Paul decided to sail past Ephesus so that he would not lose time."], "v": [["Acts 20:16", "For Paul had determined to sail past Ephesus, because he would not spend the time in Asia: for he hastened, if it were possible for him, to be at Jerusalem the day of Pentecost."]], "back": "miletus"}, "tyre": {"t": ["At Caesarea, the prophet Agabus takes your belt, ties his own hands and feet, and warns that you will be bound in Jerusalem.", "Your friends weep and beg you not to go."], "wfx": {"days": -1}, "c": [{"t": "Turn back to stay safe", "go": "w_tyre"}, {"t": "Go on, ready to suffer for the Lord", "go": "end", "fx": {"days": -1}}], "v": []}, "w_tyre": {"wrong": true, "t": ["Paul would not turn back."], "v": [["Acts 21:13", "Then Paul answered, What mean you to weep and to break my heart? for I am ready not to be bound only, but also to die at Jerusalem for the name of the Lord Jesus."]], "back": "tyre"}, "end": {"end": true, "t": ["You go up to Jerusalem in time. The believers there receive you gladly."], "v": [["Acts 21:17", "And when we were come to Jerusalem, the brethren received us gladly."], ["Acts 20:24", "But none of these things move me, neither count I my life dear unto myself, so that I might finish my course with joy, and the ministry, which I have received of the Lord Jesus, to testify the gospel of the grace of God."]], "lesson": "I have finished my course with joy."}}, "sol": [0, 1, 1, 1, 1, 0, 2, 1, 0, 0, 1, 0, 1, 1, 0, 1, 1, 1, 1], "losepath": [0, 0, "back", 0, "back", 0, "back", 1, 0]}, "adv_nehemiah": {"name": "Nehemiah and the Wall", "start": "start", "stats": [["seen", "Places seen", 0]], "how": "You are Nehemiah. Explore the ruined walls of Jerusalem by night. Visit every place before you call the people to build. Some things you need must be asked for early, so think ahead. Wrong turns show what the Bible says.", "nodes": {"start": {"t": ["You are Nehemiah, cupbearer to King Artaxerxes in the palace at Shushan.", "Your brother Hanani comes from Judah with bad news."], "v": [["Nehemiah 1:3", "And they said unto me, The remnant that are left of the captivity there in the province are in great distress and reproach: the wall of Jerusalem also is broken down, and the gates thereof are burned with fire."]], "c": [{"t": "Shrug, it is far away", "go": "w_start"}, {"t": "Weep, fast and pray", "go": "king"}]}, "w_start": {"wrong": true, "t": ["Nehemiah sat down and wept, and mourned, and fasted, and prayed for days."], "v": [["Nehemiah 1:4", "And it came to pass, when I heard these words, that I sat down and wept, and mourned certain days, and fasted, and prayed before the God of heaven,"]], "back": "start"}, "king": {"t": ["Months later you bring wine to the king. He sees that your face is sad and asks why."], "c": [{"t": "Pray to God, then ask to be sent to rebuild", "go": "letters"}, {"t": "Make up an excuse", "go": "w_king"}], "v": []}, "w_king": {"wrong": true, "t": ["Nehemiah prayed to God and told the king the truth."], "v": [["Nehemiah 2:4", "Then the king said unto me, For what do you make request? So I prayed to the God of heaven."], ["Nehemiah 2:5", "And I said unto the king, If it pleases the king, and if your servant has found favor in your sight, that you would send me unto Judah, unto the city of my fathers’ sepulchers, that I may rebuild it."]], "back": "king"}, "letters": {"t": ["The king agrees and asks how long you will be gone. Before you leave, what else will you ask for?"], "c": [{"t": "Nothing more, just leave", "go": "w_letters"}, {"t": "Letters for safe passage, and a letter for timber from the king's forest", "go": "arrive", "set": ["letters"]}], "v": []}, "w_letters": {"wrong": true, "t": ["Nehemiah asked for letters, and the king gave them by the good hand of God."], "v": [["Nehemiah 2:7", "Moreover I said unto the king, If it please the king, let letters be given me to the governors beyond the river, that they may let me pass over till I come into Judah;"], ["Nehemiah 2:8", "And a letter unto Asaph the keeper of the king’s forest, that he may give me timber to make beams for the gates of the fortress which pertains to the house, and for the wall of the city, and for the temple that I shall enter into. And the king so granted me, according to the good hand of my God upon me."]], "back": "letters"}, "arrive": {"t": ["You come to Jerusalem and rest three days.", "You tell no one what God has put in your heart. You get up in the night with a few men to see the walls for yourself."], "v": [["Nehemiah 2:12", "And I arose in the night, I and some few men with me; neither told I any man what my God had put in my heart to do at Jerusalem: neither was there any animal with me, except the animal that I rode upon."]], "c": [{"t": "Ride out into the dark", "go": "night"}]}, "night": {"head": "Jerusalem by night", "t": ["You sit on your beast outside the broken walls. The burned gates are dark shapes in the moonlight.", "Where will you go?"], "c": [{"t": "Go out by the Valley Gate to the Jackal's Well", "go": "valley", "fx": {"seen": 1}, "not": ["valley"], "set": ["valley"]}, {"t": "Ride on to the Refuse Gate", "go": "dung", "fx": {"seen": 1}, "not": ["dung"], "set": ["dung"]}, {"t": "Go on to the Fountain Gate and the King's Pool", "go": "fountain", "not": ["fountain"]}, {"t": "Tell the rulers your plan right now", "go": "w_tell"}, {"t": "Return and call the people to build", "go": "rally", "min": {"seen": 3}}], "v": []}, "w_tell": {"wrong": true, "t": ["Wait. Nehemiah had not told the rulers anything until he had seen it all."], "v": [["Nehemiah 2:16", "And the rulers knew not where I went, or what I did; neither had I as yet told it to the Jews, nor to the priests, nor to the nobles, nor to the rulers, nor to the rest that did the work."]], "back": "night"}, "valley": {"t": ["You pass the Valley Gate and ride to the Jackal's Well. The walls are broken down and the gates burned with fire."], "v": [["Nehemiah 2:13", "And I went out by night by the gate of the valley, even to the jackal’s well, and to the refuse gate, and viewed the walls of Jerusalem, which were broken down; and the gates thereof were consumed with fire."]], "c": [{"t": "Go back", "go": "night"}]}, "dung": {"t": ["You ride along to the Refuse Gate. It is the same everywhere: rubble and ashes."], "c": [{"t": "Go back", "go": "night"}], "v": []}, "fountain": {"t": ["At the Fountain Gate and the King's Pool the rubble is so thick that your beast cannot get through."], "v": [["Nehemiah 2:14", "Then I went on to the gate of the fountain, and to the king’s pool: but there was no place for the animal that was under me to pass."]], "c": [{"t": "Force the beast over the stones", "go": "w_fountain"}, {"t": "Leave the beast and go up through the valley to view the wall", "go": "brook", "fx": {"seen": 1}, "set": ["fountain"]}]}, "w_fountain": {"wrong": true, "t": ["There was no room for the beast to pass. Nehemiah went up by the valley instead."], "v": [["Nehemiah 2:15", "Then went I up in the night by the valley, and viewed the wall, and turned back, and entered by the gate of the valley, and so returned."]], "back": "fountain"}, "brook": {"t": ["Up through the valley in the night you view the wall, then turn back and come in again by the Valley Gate."], "c": [{"t": "Go back", "go": "night"}], "v": []}, "rally": {"t": ["You call the priests, the nobles and the rulers, and tell them how the hand of God was good to you."], "v": [["Nehemiah 2:18", "Then I told them of the hand of my God which was good upon me; as also the king’s words that he had spoken unto me. And they said, Let us rise up and build. So they strengthened their hands for this good work."]], "c": [{"t": "Show the king's letter to Asaph, keeper of the king's forest", "go": "build", "need": ["letters"]}]}, "build": {"t": ["Timber comes for the gates, and every family builds the part of the wall nearest them.", "Sanballat and Tobiah laugh at you. Will these feeble Jews really finish? A fox could knock their wall down!"], "v": [["Nehemiah 4:3", "Now Tobiah the Ammonite was by him, and he said, Even that which they build, if a fox goes up, he shall even break down their stone wall."]], "c": [{"t": "Mock them back", "go": "w_build"}, {"t": "Pray, and keep building", "go": "threat"}]}, "w_build": {"wrong": true, "t": ["Nehemiah did not answer with mockery. He prayed."], "v": [["Nehemiah 4:4", "Hear, O our God; for we are despised: and turn their reproach upon their own head, and give them for a spoil in a land of captivity:"]], "back": "build"}, "threat": {"t": ["The wall is joined together up to half its height, for the people have a mind to work. Now your enemies plot to attack."], "v": [["Nehemiah 4:6", "So built we the wall; and all the wall was joined together unto the half thereof: for the people had a mind to work."]], "c": [{"t": "Stop the work until it is safe", "go": "w_threat"}, {"t": "Pray and set a guard: half work, half hold spears", "go": "ono"}]}, "w_threat": {"wrong": true, "t": ["They did not stop. They prayed and set a watch day and night."], "v": [["Nehemiah 4:9", "Nevertheless we made our prayer unto our God, and set a watch against them day and night, because of them."], ["Nehemiah 4:17", "They who built on the wall, and they that bore burdens, so burdened themselves, everyone with one of his hands worked in the work, and with the other hand held a weapon."]], "back": "threat"}, "ono": {"t": ["Only the gates are left to hang. Sanballat sends a message four times: come down and meet us in the plain of Ono.", "But they mean to do you harm."], "c": [{"t": "Go to the meeting to make peace", "go": "w_ono"}, {"t": "Answer: I am doing a great work, I cannot come down", "go": "end"}], "v": []}, "w_ono": {"wrong": true, "t": ["Nehemiah would not come down."], "v": [["Nehemiah 6:3", "And I sent messengers unto them, saying, I am doing a great work, so that I cannot come down: why should the work cease, while I leave it, and come down to you?"]], "back": "ono"}, "end": {"end": true, "t": ["The wall is finished in fifty-two days."], "v": [["Nehemiah 6:15", "So the wall was finished in the twenty and fifth day of the month Elul, in fifty and two days."], ["Nehemiah 6:16", "And it came to pass, that when all our enemies heard of it, and all the nations that were about us saw these things, they were much cast down in their own eyes: for they perceived that this work was done by our God."]], "lesson": "This work was done by our God."}}, "sol": [1, 0, 1, 0, 0, 0, 1, 0, 2, 1, 0, 4, 0, 1, 1, 1]}, "adv_daniel": {"name": "Daniel in Babylon", "start": "start", "stats": [["faith", "Faith", 1], ["wis", "Wisdom", 1], ["fav", "Favor", 2]], "max": 5, "wfx": {"fav": -1}, "lose": {"fav": {"t": "You lost all your favor in Babylon. Wrong turns cost Favor. Pray, study and serve faithfully, and try again.", "v": [["Daniel 1:9", "Now God had brought Daniel into favor and kindness with the prince of the eunuchs."]]}}, "how": "You are Daniel, taken to Babylon. Each day, choose to Pray, Study or Serve to build your Faith, Wisdom and Favor (5 at most). New chapters open when your scores are high enough. Wrong turns cost 1 Favor. If Favor reaches 0, it is game over.", "nodes": {"start": {"t": ["Nebuchadnezzar king of Babylon has taken Jerusalem. You are one of the young men carried away to serve in his palace."], "v": [["Daniel 1:6", "Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:"]], "c": [{"t": "Begin your life in Babylon", "go": "day"}]}, "day": {"head": "A day in Babylon", "t": ["How will you spend today? Or is a chapter of your story ready?"], "c": [{"t": "Pray", "go": "pray", "fx": {"faith": 1}}, {"t": "Study", "go": "study", "fx": {"wis": 1}}, {"t": "Serve faithfully", "go": "serve", "fx": {"fav": 1}}, {"t": "Chapter 1: The king's food", "go": "food", "not": ["c1"]}, {"t": "Chapter 2: The king's dream", "go": "dream", "need": ["c1"], "not": ["c2"], "min": {"wis": 3}}, {"t": "Chapter 3: The image of gold", "go": "image", "need": ["c2"], "not": ["c3"], "min": {"faith": 3}}, {"t": "Chapter 4: The writing on the wall", "go": "wall", "need": ["c3"], "not": ["c4"], "min": {"wis": 4, "fav": 5}}, {"t": "Chapter 5: The lions' den", "go": "decree", "need": ["c4"], "min": {"faith": 5}}], "v": []}, "pray": {"t": ["You kneel and seek the Lord."], "v": [["Daniel 9:3", "And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes:"]], "c": [{"t": "End the day", "go": "day"}]}, "study": {"t": ["You study the books, the writings of the prophets."], "v": [["Daniel 9:2", "In the first year of his reign I Daniel understood from the books the number of the years, of which the word of the LORD came to Jeremiah the prophet, that he would accomplish seventy years in the desolations of Jerusalem."]], "c": [{"t": "End the day", "go": "day"}]}, "serve": {"t": ["You do your work well and honestly."], "v": [["Daniel 6:4", "Then the presidents and satraps sought to find occasion against Daniel concerning the kingdom; but they could find no occasion nor fault; because he was faithful, neither was there any error or fault found in him."]], "c": [{"t": "End the day", "go": "day"}]}, "food": {"head": "The king's food", "t": ["The king gives you a daily portion of his own food and wine. But some of it is food God's law forbids."], "v": [["Daniel 1:5", "And the king appointed them a daily provision of the king’s food, and of the wine which he drank: so training them three years, that at the end of that time they might stand before the king."]], "c": [{"t": "Eat it; you have no choice", "go": "w_food"}, {"t": "Ask for vegetables and water for ten days", "go": "food2"}]}, "w_food": {"wrong": true, "t": ["Daniel purposed in his heart that he would not defile himself."], "v": [["Daniel 1:8", "But Daniel purposed in his heart that he would not defile himself with the portion of the king’s food, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile himself."]], "back": "food"}, "food2": {"t": ["At the end of ten days you and your friends look healthier than all the others."], "v": [["Daniel 1:17", "As for these four young men, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams."]], "c": [{"t": "Back to your days", "go": "day", "fx": {"wis": 1}, "set": ["c1"]}]}, "dream": {"head": "The king's dream", "t": ["The king has a dream that troubles him. He wants his wise men to tell him the dream itself, and what it means. No one can. He orders all the wise men killed, and you are among them."], "v": [["Daniel 2:13", "And the decree went forth that the wise men should be slain; and they sought Daniel and his fellows to be slain."]], "c": [{"t": "Make a clever guess", "go": "w_dream"}, {"t": "Ask for time, and pray with your friends", "go": "dream2"}]}, "w_dream": {"wrong": true, "t": ["Daniel did not guess. He asked his friends to pray for mercy from the God of heaven."], "v": [["Daniel 2:18", "That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."]], "back": "dream"}, "dream2": {"t": ["That night God shows you the secret in a vision. You stand before the king."], "c": [{"t": "Say you are wiser than the others", "go": "w_dream2"}, {"t": "Say there is a God in heaven who reveals secrets", "go": "dream3"}], "v": []}, "w_dream2": {"wrong": true, "t": ["Daniel took no credit for himself."], "v": [["Daniel 2:30", "But as for me, this secret is not revealed to me for any wisdom that I have more than anyone living, but for their sakes that shall make known the interpretation to the king, and that you might know the thoughts of your heart."]], "back": "dream2"}, "dream3": {"t": ["You tell the dream and its meaning. The king honors you."], "v": [["Daniel 2:28", "But there is a God in heaven that reveals secrets, and makes known to king Nebuchadnezzar what shall be in the latter days. Your dream, and the visions of your head upon your bed, are these;"], ["Daniel 2:48", "Then the king made Daniel a great man, and gave him many great gifts, and made him ruler over the whole province of Babylon, and chief of the governors over all the wise men of Babylon."]], "c": [{"t": "Back to your days", "go": "day", "fx": {"fav": 2}, "set": ["c2"]}]}, "image": {"head": "The image of gold", "t": ["The king sets up a great image of gold. Everyone must bow when the music plays. Your friends Shadrach, Meshach and Abednego will not bow, and they are brought to the king."], "c": [{"t": "Tell them to bow, just this once", "go": "w_image"}, {"t": "Stand with them and trust God", "go": "image2"}], "v": []}, "w_image": {"wrong": true, "t": ["The three friends would not bow, whatever happened."], "v": [["Daniel 3:18", "But if not, be it known unto you, O king, that we will not serve your gods, nor worship the golden image which you have set up."]], "back": "image"}, "image2": {"t": ["They are thrown into a furnace heated seven times hotter. But the king looks in and is astonished."], "v": [["Daniel 3:25", "He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they are not hurt; and the form of the fourth is like a son of the gods."]], "c": [{"t": "Back to your days", "go": "day", "fx": {"faith": 1}, "set": ["c3"]}]}, "wall": {"head": "The writing on the wall", "t": ["Years pass. King Belshazzar holds a feast and drinks from the holy cups taken from God's temple. Fingers of a man's hand write on the wall. The king sends for you and promises rich gifts."], "c": [{"t": "Take the gifts and make the message softer", "go": "w_wall"}, {"t": "Refuse the gifts and read it plainly", "go": "wall2"}], "v": []}, "w_wall": {"wrong": true, "t": ["Daniel told the king to keep his gifts."], "v": [["Daniel 5:17", "Then Daniel answered and said before the king, Let your gifts be to yourself, and give your rewards to another; yet I will read the writing unto the king, and make known to him the interpretation."]], "back": "wall"}, "wall2": {"t": ["You read the writing and its meaning."], "v": [["Daniel 5:25", "And this is the writing that was written, MENE, MENE, TEKEL, UPHARSIN."], ["Daniel 5:27", "TEKEL; you are weighed in the balances, and are found wanting."]], "c": [{"t": "Back to your days", "go": "day", "fx": {"fav": 1}, "set": ["c4"]}]}, "decree": {"head": "The lions' den", "t": ["Under King Darius you are a top ruler. Jealous men trick the king into a law: for thirty days, anyone who prays to any god or man except the king will be thrown to the lions."], "v": [["Daniel 6:7", "All the presidents of the kingdom, the governors, and the satraps, the counselors, and the advisors, have consulted together to establish a royal statute, and to make a firm decree, that whosoever shall ask a petition of any God or man for thirty days, except from you, O king, he shall be cast into the den of lions."]], "c": [{"t": "Stop praying for thirty days", "go": "w_decree"}, {"t": "Pray in secret where no one can see", "go": "w_secret"}, {"t": "Pray at your open window three times a day, as before", "go": "den"}]}, "w_decree": {"wrong": true, "t": ["Daniel kept on praying."], "v": [["Daniel 6:10", "Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did before."]], "back": "decree"}, "w_secret": {"wrong": true, "t": ["Daniel did not hide. His windows were open toward Jerusalem, as before."], "v": [["Daniel 6:10", "Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did before."]], "back": "decree"}, "den": {"t": ["They find you praying, and the king, though sorry, must throw you into the den. At dawn he runs to the den and calls out to you."], "v": [["Daniel 6:20", "And when he came to the den, he cried with a grieved voice unto Daniel: and the king spoke and said to Daniel, O Daniel, servant of the living God, is your God, whom you serve continually, able to deliver you from the lions?"]], "c": [{"t": "Answer the king", "go": "end"}]}, "end": {"end": true, "t": ["You answer from among the lions."], "v": [["Daniel 6:22", "My God has sent his angel, and has shut the lions’ mouths, that they have not hurt me: because before him innocence was found in me; and also before you, O king, have I done no wrong."], ["Daniel 6:23", "Then was the king exceedingly glad for him, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of harm was found upon him, because he believed in his God."]], "lesson": "He believed in his God."}}, "sol": [0, 0, 0, 0, 0, 0, 0, 1, 0, 1, 0, 2, 0, 3, 1, 0, 4, 1, 1, 0, 5, 1, 0, 6, 1, 0, 7, 2, 0], "losepath": [0, 3, 0, "back", 0]}, "adv_tabernacle": {"name": "Building the Tabernacle", "start": "start", "stats": [["made", "Pieces made", 0]], "how": "You are Bezaleel, the master builder. Make each piece exactly by God's pattern, then set each one in its right place. Make all five pieces before you set up the tabernacle. Wrong turns show what the Bible says.", "nodes": {"start": {"t": ["God calls Moses up the mountain and shows him the pattern of a tabernacle, a holy tent where He will dwell among His people."], "v": [["Exodus 25:8", "And let them make me a sanctuary; that I may dwell among them."]], "c": [{"t": "Improve the design with your own ideas", "go": "w_start"}, {"t": "Follow the pattern exactly", "go": "gifts"}]}, "w_start": {"wrong": true, "t": ["God said to make everything after the pattern."], "v": [["Exodus 25:40", "And see that you make them after their pattern, which was shown you on the mount."]], "back": "start"}, "gifts": {"t": ["The people bring gold, silver, bronze, cloth and wood with willing hearts. Soon they bring far more than is needed."], "v": [["Exodus 36:5", "And they spoke unto Moses, saying, The people bring much more than enough for the service of the work, which the LORD commanded to make."]], "c": [{"t": "Keep collecting, just in case", "go": "w_gifts"}, {"t": "Tell them to stop giving", "go": "shop"}]}, "w_gifts": {"wrong": true, "t": ["Moses sent word through the camp that the people should bring no more."], "v": [["Exodus 36:6", "And Moses gave commandment, and they caused it to be proclaimed throughout the camp, saying, Let neither man nor woman make any more work for the offering of the sanctuary. So the people were restrained from bringing."]], "back": "gifts"}, "shop": {"head": "The workshop", "t": ["The LORD has filled you with His Spirit, in wisdom and in all kinds of work.", "Which piece will you make?"], "v": [["Exodus 31:3", "And I have filled him with the spirit of God, in wisdom, and in understanding, and in knowledge, and in all manner of workmanship,"]], "c": [{"t": "The ark of the covenant", "go": "ark", "not": ["ark"]}, {"t": "The table", "go": "table", "not": ["table"]}, {"t": "The lampstand", "go": "lamp", "not": ["lamp"]}, {"t": "The altar of burnt offering", "go": "altar", "not": ["altar"]}, {"t": "The laver for washing", "go": "laver", "not": ["laver"]}, {"t": "Set up the tabernacle", "go": "setup", "min": {"made": 5}}]}, "ark": {"t": ["The ark is a chest to hold the testimony. What will you make it from?"], "c": [{"t": "Cedar wood covered with silver", "go": "w_ark"}, {"t": "Acacia wood covered with pure gold", "go": "ark2"}], "v": []}, "w_ark": {"wrong": true, "t": ["The ark was acacia wood, overlaid inside and out with pure gold."], "v": [["Exodus 25:10", "And they shall make an ark of acacia wood: two cubits and a half shall be the length of it, and a cubit and a half the breadth of it, and a cubit and a half the height of it."], ["Exodus 25:11", "And you shall overlay it with pure gold, inside and outside shall you overlay it, and shall make upon it a molding of gold round about."]], "back": "ark"}, "ark2": {"t": ["Now the mercy seat, the lid of pure gold. What goes on it?"], "c": [{"t": "An image of the LORD", "go": "w_ark2"}, {"t": "Two cherubim of gold, their wings covering the mercy seat", "go": "shop", "fx": {"made": 1}, "set": ["ark"]}], "v": []}, "w_ark2": {"wrong": true, "t": ["God forbids any image of Himself. The pattern was two cherubim of gold."], "v": [["Exodus 20:4", "You shall not make unto yourself any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth:"], ["Exodus 25:20", "And the cherubim shall stretch forth their wings above, covering the mercy seat with their wings, and their faces shall face one another; toward the mercy seat shall the faces of the cherubim be."]], "back": "ark2"}, "table": {"t": ["The table is acacia wood covered with gold. What is always set on it before the LORD?"], "c": [{"t": "Bowls of fruit", "go": "w_table"}, {"t": "The showbread", "go": "shop", "fx": {"made": 1}, "set": ["table"]}], "v": []}, "w_table": {"wrong": true, "t": ["The showbread was to be on the table always."], "v": [["Exodus 25:30", "And you shall set upon the table showbread before me always."]], "back": "table"}, "lamp": {"t": ["The lampstand is beaten from pure gold. How many lamps does it hold?"], "c": [{"t": "Three lamps", "go": "w_lamp"}, {"t": "Seven lamps", "go": "shop", "fx": {"made": 1}, "set": ["lamp"]}, {"t": "Twelve lamps, one for each tribe", "go": "w_lamp"}], "v": []}, "w_lamp": {"wrong": true, "t": ["The lampstand had seven lamps."], "v": [["Exodus 25:37", "And you shall make its seven lamps : and they shall light its lamps, that they may give light in front of it."]], "back": "lamp"}, "altar": {"t": ["The altar of burnt offering is acacia wood. What covers it?"], "c": [{"t": "Bronze", "go": "shop", "fx": {"made": 1}, "set": ["altar"]}, {"t": "Gold", "go": "w_altar"}], "v": []}, "w_altar": {"wrong": true, "t": ["The altar of burnt offering was overlaid with bronze."], "v": [["Exodus 27:2", "And you shall make the horns of it upon its four corners: its horns shall be of one piece with it: and you shall overlay it with bronze."]], "back": "altar"}, "laver": {"t": ["The laver is a bronze basin for the priests to wash in. Where does the bronze come from?"], "c": [{"t": "Melted Egyptian idols", "go": "w_laver"}, {"t": "The mirrors of the women who served at the door", "go": "shop", "fx": {"made": 1}, "set": ["laver"]}], "v": []}, "w_laver": {"wrong": true, "t": ["The laver was made from the women's bronze mirrors."], "v": [["Exodus 38:8", "And he made the laver of bronze, and the base of it of bronze, from the bronze mirrors of the women serving, who served at the door of the tabernacle of meeting."]], "back": "laver"}, "setup": {"head": "Setting it up", "t": ["On the first day of the first month the tabernacle is raised. A veil divides the holy place from the most holy place. Where does the ark go?"], "c": [{"t": "Outside by the door, for all to see", "go": "w_setup"}, {"t": "Inside the veil, in the most holy place", "go": "setup2"}], "v": []}, "w_setup": {"wrong": true, "t": ["The ark went inside the veil."], "v": [["Exodus 40:21", "And he brought the ark into the tabernacle, and set up the veil of the screen, and screened the ark of the testimony; as the LORD commanded Moses."]], "back": "setup"}, "setup2": {"t": ["In the holy place, outside the veil, the table and the lampstand must face each other. Where do they go?"], "c": [{"t": "Table on the north side, lampstand on the south", "go": "setup3"}, {"t": "Both on the same side", "go": "w_setup2"}], "v": []}, "w_setup2": {"wrong": true, "t": ["The table was on the north side, and the lampstand on the south side, across from it."], "v": [["Exodus 40:22", "And he put the table in the tent of the congregation, upon the north side of the tabernacle, outside the veil."], ["Exodus 40:24", "And he put the lampstand in the tent of the congregation, opposite the table, on the south side of the tabernacle."]], "back": "setup2"}, "setup3": {"t": ["Last, the altar of burnt offering and the laver go in the courtyard. Which goes nearer the tent?"], "c": [{"t": "The laver, between the tent and the altar", "go": "end"}, {"t": "The altar, right against the tent door", "go": "w_setup3"}], "v": []}, "w_setup3": {"wrong": true, "t": ["The altar stood at the door, and the laver was set between the tent and the altar."], "v": [["Exodus 40:6", "And you shall set the altar of the burnt offering before the door of the tabernacle of the tent of the congregation."], ["Exodus 40:7", "And you shall set the laver between the tent of the congregation and the altar, and shall put water in it."]], "back": "setup3"}, "end": {"end": true, "t": ["Moses finishes the work. Then the cloud covers the tent."], "v": [["Exodus 40:34", "Then a cloud covered the tent of the congregation, and the glory of the LORD filled the tabernacle."]], "lesson": "According to all that the LORD commanded Moses, so they did."}}, "sol": [1, 1, 0, 1, 1, 1, 1, 2, 1, 3, 0, 4, 1, 5, 1, 0, 0]}, "adv_jonah": {"name": "Jonah, the Runaway Prophet", "start": "start", "how": "This one is tricky. You are Jonah, and you must choose what Jonah REALLY did, even when it was wrong. Some answers are silly on purpose. Wrong turns show what the Bible says.", "nodes": {"start": {"t": ["You are Jonah, a prophet. One day the word of the LORD comes to you: go to Nineveh, that great city, and cry against it, for their wickedness has come up before Me.", "Nineveh is the capital of your enemies."], "v": [["Jonah 1:2", "Arise, go to Nineveh, that great city, and cry against it; for their wickedness has come up before me."]], "c": [{"t": "Go to Nineveh, as a good prophet should", "go": "w_start"}, {"t": "Head the other way, to Tarshish", "go": "joppa"}]}, "w_start": {"wrong": true, "t": ["A nice thought, but that is not what Jonah did. He ran the other way."], "v": [["Jonah 1:3", "But Jonah rose up to flee unto Tarshish from the presence of the LORD, and went down to Joppa; and he found a ship going to Tarshish: so he paid its fare, and went down into it, to go with them unto Tarshish from the presence of the LORD."]], "back": "start"}, "joppa": {"t": ["At the port of Joppa you find a ship going to Tarshish, about as far from Nineveh as you can get."], "c": [{"t": "Haggle for a cheaper ticket", "go": "w_joppa"}, {"t": "Pay the fare and get on board", "go": "ship"}], "v": []}, "w_joppa": {"wrong": true, "t": ["Jonah paid the fare. Running from God is never cheap."], "v": [["Jonah 1:3", "But Jonah rose up to flee unto Tarshish from the presence of the LORD, and went down to Joppa; and he found a ship going to Tarshish: so he paid its fare, and went down into it, to go with them unto Tarshish from the presence of the LORD."]], "back": "joppa"}, "ship": {"t": ["The LORD sends a great wind. The ship is about to break apart. The sailors are terrified, cry to their gods, and throw the cargo overboard.", "Where are you?"], "c": [{"t": "Helping bail out water", "go": "w_ship"}, {"t": "Fast asleep below deck", "go": "captain"}], "v": []}, "w_ship": {"wrong": true, "t": ["Jonah slept right through the storm."], "v": [["Jonah 1:5", "Then the mariners were afraid, and cried every man unto his god, and cast forth the wares that were in the ship into the sea, to lighten it of them. But Jonah had gone down into the lower part of the ship; and he had lain down, and was fast asleep."]], "back": "ship"}, "captain": {"t": ["The captain shakes you awake: How can you sleep? Get up and call on your God!", "The sailors cast lots to find out who caused this trouble. The lot falls on you. Who are you, they ask."], "v": [["Jonah 1:7", "And they said every one to his fellow, Come, and let us cast lots, that we may know for whose cause this evil is upon us. So they cast lots, and the lot fell upon Jonah."]], "c": [{"t": "Say you are just a traveler", "go": "w_captain"}, {"t": "Tell them you fear the LORD, who made the sea and the dry land", "go": "sea"}]}, "w_captain": {"wrong": true, "t": ["Jonah told them the truth, and that he was running from the LORD."], "v": [["Jonah 1:9", "And he said unto them, I am a Hebrew; and I fear the LORD, the God of heaven, who has made the sea and the dry land."]], "back": "captain"}, "sea": {"t": ["The men are even more afraid. What shall we do to you, they ask, so the sea will be calm?"], "c": [{"t": "Grab an oar and row hard for land", "go": "w_sea"}, {"t": "Tell them to throw you into the sea", "go": "fish"}], "v": []}, "w_sea": {"wrong": true, "t": ["The sailors did row hard, but they could not reach land. Jonah told them to throw him in."], "v": [["Jonah 1:12", "And he said unto them, Take me up, and cast me forth into the sea; so shall the sea be calm for you: for I know that for my sake this great tempest is upon you."], ["Jonah 1:13", "Nevertheless the men rowed hard to bring it to the land; but they could not: for the sea raged, and was tempestuous against them."]], "back": "sea"}, "fish": {"t": ["Splash. The sea grows calm. Then something very large swallows you whole.", "It is dark. It is damp. It smells like three days of old fish, because it is."], "v": [["Jonah 1:17", "Now the LORD had prepared a great fish to swallow up Jonah. And Jonah was in the belly of the fish three days and three nights."]], "c": [{"t": "Look for the exit", "go": "w_fish1"}, {"t": "Complain about the smell", "go": "w_fish2"}, {"t": "Pray", "go": "shore"}]}, "w_fish1": {"wrong": true, "t": ["There is no exit from a fish. Jonah prayed."], "v": [["Jonah 2:1", "Then Jonah prayed unto the LORD his God out of the fish’s belly,"]], "back": "fish"}, "w_fish2": {"wrong": true, "t": ["Fair, but Jonah prayed instead."], "v": [["Jonah 2:2", "And said, I cried by reason of my affliction unto the LORD, and he heard me; out of the belly of sheol cried I, and you heard my voice."]], "back": "fish"}, "shore": {"t": ["The LORD speaks to the fish. You land on dry ground in a very undignified way."], "v": [["Jonah 2:10", "And the LORD spoke unto the fish, and it vomited out Jonah upon the dry land."]], "c": [{"t": "Try for Tarshish again", "go": "w_shore"}, {"t": "Go to Nineveh, as the LORD says the second time", "go": "nineveh"}]}, "w_shore": {"wrong": true, "t": ["Once was enough. This time Jonah obeyed."], "v": [["Jonah 3:3", "So Jonah arose, and went unto Nineveh, according to the word of the LORD. Now Nineveh was an exceedingly great city of three days’ journey around it."]], "back": "shore"}, "nineveh": {"t": ["Nineveh is huge: three days' walk across. You start in. What do you preach?"], "c": [{"t": "A long sermon with three points and a poem", "go": "w_nineveh"}, {"t": "Yet forty days, and Nineveh shall be overthrown", "go": "repent"}], "v": []}, "w_nineveh": {"wrong": true, "t": ["Jonah's whole recorded sermon is eight words in our English Bible."], "v": [["Jonah 3:4", "And Jonah began to enter into the city a day’s journey, and he cried, and said, Yet forty days, and Nineveh shall be overthrown."]], "back": "nineveh"}, "repent": {"t": ["The whole city believes God. Even the king puts on sackcloth and sits in ashes. God sees them turn from their evil and spares the city."], "v": [["Jonah 3:10", "And God saw their works, that they turned from their evil way; and God relented of the disaster, that he had said that he would bring upon them; and he did it not."]], "c": [{"t": "Celebrate the great revival", "go": "w_repent"}, {"t": "Get very angry about it", "go": "plant"}]}, "w_repent": {"wrong": true, "t": ["Sadly, Jonah was not happy at all."], "v": [["Jonah 4:1", "But it displeased Jonah exceedingly, and he was very angry."]], "back": "repent"}, "plant": {"t": ["You sit outside the city to see what will happen. God makes a plant grow to shade you, and you are very glad.", "Next morning a worm kills the plant, and a hot east wind blows. The sun beats on your head."], "v": [["Jonah 4:8", "And it came to pass, when the sun did arise, that God prepared a vehement east wind; and the sun beat upon the head of Jonah, so that he fainted, and wished in himself to die, and said, It is better for me to die than to live."]], "c": [{"t": "Thank God for the lesson", "go": "w_plant"}, {"t": "Say you do well to be angry", "go": "end"}]}, "w_plant": {"wrong": true, "t": ["Jonah was still angry."], "v": [["Jonah 4:9", "And God said to Jonah, Do you do well to be angry about the plant? And he said, I do well to be angry, even unto death."]], "back": "plant"}, "end": {"end": true, "t": ["Then the LORD answers you."], "v": [["Jonah 4:10", "Then said the LORD, You have had pity on the plant, for which you have not labored, neither made it grow; which came up in a night, and perished in a night:"], ["Jonah 4:11", "And should not I spare Nineveh, that great city, in which are more than sixscore thousand persons that cannot discern between their right hand and their left hand; and also many cattle?"]], "lesson": "The LORD is gracious and merciful, and cares for people we would rather not."}}, "stats": [], "sol": [1, 1, 1, 1, 1, 2, 1, 1, 1, 1]}, "adv_wilderness": {"name": "Israel in the Wilderness", "start": "start", "stats": [["water", "Water", 3], ["heart", "Courage", 3]], "wfx": {"heart": -1}, "lose": {"water": {"t": "The water ran out in the desert. Trust the LORD to provide, and try again.", "v": [["Exodus 17:6", "Behold, I will stand before you there upon the rock in Horeb; and you shall strike the rock, and there shall come water out of it, that the people may drink. And Moses did so in the sight of the elders of Israel."]]}, "heart": {"t": "The camp lost heart and wanted to go back to Egypt. Each wrong turn cost Courage.", "v": [["Numbers 14:9", "Only rebel not against the LORD, neither fear you the people of the land; for they are bread for us: their defense is departed from them, and the LORD is with us: fear them not."]]}}, "how": "You are Joshua, Moses' helper, leading Israel through the wilderness. Each journey costs Water, and only the LORD can give more. Each wrong turn costs Courage. If Water or Courage reaches 0, it is game over.", "nodes": {"start": {"t": ["The LORD has brought Israel through the Red Sea. Now you march three days into the wilderness of Shur and find no water."], "v": [["Exodus 15:22", "So Moses brought Israel from the Red sea, and they went out into the wilderness of Shur; and they went three days in the wilderness, and found no water."]], "c": [{"t": "March on to Marah", "go": "marah", "fx": {"water": -2}}]}, "marah": {"t": ["At Marah there is water, but it is bitter. The people complain against Moses."], "v": [["Exodus 15:24", "And the people murmured against Moses, saying, What shall we drink?"]], "c": [{"t": "Drink it anyway", "go": "w_marah"}, {"t": "Cry to the LORD, who shows Moses a tree to throw in", "go": "manna", "fx": {"water": 2}}]}, "w_marah": {"wrong": true, "t": ["The water could not be drunk. Moses cried to the LORD, and the LORD made it sweet."], "v": [["Exodus 15:25", "And he cried unto the LORD; and the LORD showed him a tree, which when he had cast it into the waters, the waters were made sweet: there he made for them a statute and an ordinance, and there he proved them,"]], "back": "marah"}, "manna": {"t": ["In the wilderness of Sin the people are hungry. The LORD sends bread from heaven every morning: manna."], "v": [["Exodus 16:4", "Then said the LORD unto Moses, Behold, I will rain bread from heaven for you; and the people shall go out and gather a certain portion every day, that I may prove them, whether they will walk in my law, or not."]], "c": [{"t": "Gather extra and keep it for tomorrow", "go": "w_manna"}, {"t": "Gather just what each person needs today", "go": "sixth"}]}, "w_manna": {"wrong": true, "t": ["Manna kept overnight bred worms and stank."], "v": [["Exodus 16:20", "But they hearkened not unto Moses; but some of them left some of it until the morning, and it bred worms, and stank: and Moses was angry with them."]], "back": "manna"}, "sixth": {"t": ["It is the sixth day."], "c": [{"t": "Gather twice as much, for tomorrow is the sabbath", "go": "rephidim", "fx": {"water": -2}}, {"t": "Gather the usual amount and go out again on the seventh day", "go": "w_sixth"}], "v": []}, "w_sixth": {"wrong": true, "t": ["On the seventh day there was no manna to find."], "v": [["Exodus 16:26", "Six days you shall gather it; but on the seventh day, which is the sabbath, in it there shall be none."], ["Exodus 16:27", "And it came to pass, that there went out some of the people on the seventh day to gather, and they found none."]], "back": "sixth"}, "rephidim": {"t": ["At Rephidim there is no water at all. The people quarrel with Moses and are ready to stone him."], "c": [{"t": "Lead the people back toward Egypt", "go": "w_rephidim"}, {"t": "Moses strikes the rock as the LORD commands", "go": "amalek", "fx": {"water": 3}}], "v": []}, "w_rephidim": {"wrong": true, "t": ["Moses struck the rock, and water came out for the people to drink."], "v": [["Exodus 17:6", "Behold, I will stand before you there upon the rock in Horeb; and you shall strike the rock, and there shall come water out of it, that the people may drink. And Moses did so in the sight of the elders of Israel."]], "back": "rephidim"}, "amalek": {"t": ["Amalek attacks. Moses sends you to fight while he stands on the hill with the rod of God. When his hands are up, Israel wins. When they drop, Amalek wins."], "v": [["Exodus 17:11", "And it came to pass, when Moses held up his hand, that Israel prevailed: and when he let down his hand, Amalek prevailed."]], "c": [{"t": "Let Moses rest his arms", "go": "w_amalek"}, {"t": "Aaron and Hur hold up his hands until sunset", "go": "spies"}]}, "w_amalek": {"wrong": true, "t": ["Aaron and Hur held up his hands, and his hands were steady until the sun went down."], "v": [["Exodus 17:12", "But Moses’ hands were heavy; and they took a stone, and put it under him, and he sat on it; and Aaron and Hur held up his hands, the one on the one side, and the other on the other side; and his hands were steady until the going down of the sun."]], "back": "amalek"}, "spies": {"t": ["At Kadesh you and eleven others spy out Canaan. It flows with milk and honey, but the cities are walled and the people are giants. Ten spies say Israel cannot win."], "c": [{"t": "Agree with the ten", "go": "w_spies"}, {"t": "Stand with Caleb: the LORD is with us", "go": "edom", "fx": {"water": -1}}], "v": []}, "w_spies": {"wrong": true, "t": ["Joshua and Caleb stood together against the ten."], "v": [["Numbers 14:9", "Only rebel not against the LORD, neither fear you the people of the land; for they are bread for us: their defense is departed from them, and the LORD is with us: fear them not."]], "back": "spies"}, "edom": {"t": ["Years later, Israel asks the king of Edom to let you pass along the King's Highway. Edom comes out against you with a strong army."], "v": [["Numbers 20:20", "And he said, you shall not go through. And Edom came out against him with much people, and with a strong hand."]], "c": [{"t": "Fight your way through", "go": "w_edom"}, {"t": "Turn away and go around", "go": "serpents", "fx": {"water": -1}}]}, "w_edom": {"wrong": true, "t": ["Israel turned away from Edom."], "v": [["Numbers 20:21", "Thus Edom refused to give Israel passage through his border: therefore Israel turned away from him."]], "back": "edom"}, "serpents": {"t": ["The long road around wears the people out. They speak against God and Moses, and the LORD sends fiery serpents among them. Many die."], "c": [{"t": "Look for a medicine", "go": "w_serp"}, {"t": "Look at the bronze serpent Moses lifts up", "go": "balak"}], "v": []}, "w_serp": {"wrong": true, "t": ["Whoever looked at the bronze serpent lived."], "v": [["Numbers 21:9", "And Moses made a serpent of bronze, and put it upon a pole, and it came to pass, that if a serpent had bitten any man, when he beheld the serpent of bronze, he lived."]], "back": "serpents"}, "balak": {"t": ["You camp in the plains of Moab. Balak king of Moab is afraid of you, and he hires the prophet Balaam to curse Israel."], "v": [["Numbers 22:6", "Come now therefore, I pray you, curse for me this people; for they are too mighty for me: perhaps I shall prevail, that we may smite them, and that I may drive them out of the land: for I know that he whom you bless is blessed, and he whom you curse is cursed."]], "c": [{"t": "Send Balak gifts to buy peace", "go": "w_balak"}, {"t": "Trust the LORD to keep His people", "go": "end"}]}, "w_balak": {"wrong": true, "t": ["Israel did not need to buy peace. Balaam could only say what God said."], "v": [["Numbers 23:20", "Behold, I have received commandment to bless: and he has blessed; and I cannot reverse it."]], "back": "balak"}, "end": {"end": true, "t": ["Three times Balaam tries to curse Israel, and three times he blesses you instead."], "v": [["Deuteronomy 23:5", "Nevertheless the LORD your God would not hearken unto Balaam; but the LORD your God turned the curse into a blessing unto you, because the LORD your God loved you."]], "lesson": "The LORD turned the curse into a blessing."}}, "sol": [0, 1, 1, 0, 1, 1, 1, 1, 1, 1], "losepath": [0, 0, "back", 0, "back", 0]}, "adv_samuel": {"name": "Samuel in the Night", "start": "start", "style": "term", "how": "You are the boy Samuel. Tap a command, like on an old computer. Listen carefully in the night. Wrong turns show what the Bible says.", "nodes": {"start": {"t": ["NIGHT. THE HOUSE OF THE LORD AT SHILOH.", "You are Samuel, a boy who serves the LORD under old Eli the priest. Eli's eyes are growing dim.", "The lamp of God has not yet gone out. You lie down to sleep."], "v": [["1 Samuel 3:3", "And before the lamp of God went out in the temple of the LORD, where the ark of God was, and Samuel was lying down to sleep;"]], "c": [{"t": "SLEEP", "go": "call1"}]}, "call1": {"t": ["A VOICE IN THE DARK: Samuel!"], "v": [["1 Samuel 3:4", "That the LORD called, Samuel: and he answered, Here am I."]], "c": [{"t": "IGNORE IT", "go": "w_call1"}, {"t": "RUN TO ELI", "go": "eli1"}]}, "w_call1": {"wrong": true, "t": ["Samuel answered at once: Here am I."], "v": [["1 Samuel 3:4", "That the LORD called, Samuel: and he answered, Here am I."]], "back": "call1"}, "eli1": {"t": ["Eli blinks at you. I did not call. Lie down again."], "v": [["1 Samuel 3:5", "And he ran unto Eli, and said, Here am I; for you called me. And he said, I called not; lie down again. And he went and lay down."]], "c": [{"t": "LIE DOWN", "go": "call2"}]}, "call2": {"t": ["SILENCE... THEN AGAIN: Samuel!"], "c": [{"t": "PULL THE BLANKET OVER YOUR HEAD", "go": "w_call2"}, {"t": "RUN TO ELI", "go": "eli2"}], "v": []}, "w_call2": {"wrong": true, "t": ["Samuel got up and went to Eli again."], "v": [["1 Samuel 3:6", "And the LORD called yet again, Samuel. And Samuel arose and went to Eli, and said, Here am I; for you did call me. And he answered, I called not, my son; lie down again."]], "back": "call2"}, "eli2": {"t": ["I did not call, my son. Lie down again.", "You do not yet know the LORD's voice."], "v": [["1 Samuel 3:7", "Now Samuel did not yet know the LORD, neither was the word of the LORD yet revealed unto him."]], "c": [{"t": "LIE DOWN", "go": "call3"}]}, "call3": {"t": ["A THIRD TIME: Samuel!"], "c": [{"t": "RUN TO ELI", "go": "eli3"}, {"t": "STAY AWAKE AND WAIT", "go": "w_call3"}], "v": []}, "w_call3": {"wrong": true, "t": ["Samuel went to Eli the third time."], "v": [["1 Samuel 3:8", "And the LORD called Samuel again the third time. And he arose and went to Eli, and said, Here am I; for you did call me. And Eli perceived that the LORD had called the child."]], "back": "call3"}, "eli3": {"t": ["Eli is quiet for a long moment. Then he understands. He tells you what to say."], "v": [["1 Samuel 3:9", "Therefore Eli said unto Samuel, Go, lie down: and it shall be, if he calls you, that you shall say, Speak, LORD; for your servant hears. So Samuel went and lay down in his place."]], "c": [{"t": "LIE DOWN AND LISTEN", "go": "listen"}]}, "listen": {"t": ["THE LORD COMES AND STANDS. Samuel, Samuel."], "c": [{"t": "HIDE", "go": "w_listen"}, {"t": "SAY: SPEAK, FOR YOUR SERVANT HEARS", "go": "message"}], "v": []}, "w_listen": {"wrong": true, "t": ["Samuel did not hide. He answered as Eli taught him."], "v": [["1 Samuel 3:10", "And the LORD came, and stood, and called as at other times, Samuel, Samuel. Then Samuel answered, Speak; for your servant hears."]], "back": "listen"}, "message": {"t": ["The LORD tells you a hard thing: judgment is coming on Eli's house, because his sons did evil and Eli did not stop them."], "v": [["1 Samuel 3:13", "For I have told him that I will judge his house forever for the iniquity which he knows; because his sons made themselves vile, and he restrained them not."]], "c": [{"t": "LIE STILL UNTIL MORNING", "go": "morning"}]}, "morning": {"t": ["MORNING. You open the doors of the house of the LORD. You are afraid to tell Eli.", "Eli calls you. What did He say to you? Do not hide it from me."], "v": [["1 Samuel 3:15", "And Samuel lay until the morning, and opened the doors of the house of the LORD. And Samuel feared to tell Eli the vision."]], "c": [{"t": "TELL HIM ONLY THE GOOD PARTS", "go": "w_morning"}, {"t": "TELL HIM EVERYTHING", "go": "end"}]}, "w_morning": {"wrong": true, "t": ["Samuel told him every word and hid nothing."], "v": [["1 Samuel 3:18", "And Samuel told him everything, and hid nothing from him. And he said, It is the LORD: let him do what seems to him good."]], "back": "morning"}, "end": {"end": true, "t": ["Eli bows his head: It is the LORD. Let Him do what seems good to Him.", "YEARS PASS."], "v": [["1 Samuel 3:19", "And Samuel grew, and the LORD was with him, and did let none of his words fall to the ground."], ["1 Samuel 3:20", "And all Israel from Dan even to Beersheba knew that Samuel was established to be a prophet of the LORD."]], "lesson": "Speak, LORD, for your servant hears."}}, "stats": [], "sol": [0, 1, 0, 1, 0, 0, 0, 1, 0, 1]}, "adv_esther": {"name": "Esther", "start": "start", "stats": [["cour", "Courage", 1], ["fav", "Favor", 2]], "wfx": {"fav": -1}, "lose": {"fav": {"t": "You lost the favor you needed. Each wrong turn cost Favor. Try again.", "v": [["Esther 2:17", "And the king loved Esther more than all the women, and she obtained grace and favor in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti."]]}}, "how": "You are Esther. Your choices raise your Courage and Favor. Some doors stay locked until your Courage is high enough. Each wrong turn costs 1 Favor. If Favor reaches 0, it is game over.", "nodes": {"start": {"t": ["You are Hadassah, also called Esther, an orphan raised by your cousin Mordecai in Shushan.", "King Ahasuerus is looking for a new queen, and you are taken into the palace with many young women."], "v": [["Esther 2:8", "So it came to pass, when the king’s commandment and his decree was heard, and when many maidens were gathered together unto Shushan the citadel, to the custody of Hegai, that Esther was brought also unto the king’s house, to the custody of Hegai, keeper of the women."]], "c": [{"t": "Tell everyone you are a Jew", "go": "w_start"}, {"t": "Keep your people secret, as Mordecai told you", "go": "hegai", "fx": {"fav": 1}}]}, "w_start": {"wrong": true, "t": ["Esther did not tell her people or her family, for Mordecai had told her not to."], "v": [["Esther 2:10", "Esther had not revealed her people nor her kindred: for Mordecai had charged her that she should not show it."]], "back": "start"}, "hegai": {"t": ["Hegai, keeper of the women, likes you and gives you the best place.", "Now it is your turn to go in to the king. Every woman may take whatever she wants."], "v": [["Esther 2:9", "And the maiden pleased him, and she obtained kindness of him; and he speedily gave her her beautifying ointments, with such things as belonged to her, and seven maidens, who were suitable to be given her, out of the king’s house: and he moved her and her maidens unto the best place of the house of the women."]], "c": [{"t": "Take the finest jewels you can find", "go": "w_hegai"}, {"t": "Ask for nothing but what Hegai advises", "go": "crown", "fx": {"fav": 1}}]}, "w_hegai": {"wrong": true, "t": ["Esther asked for nothing but what Hegai chose."], "v": [["Esther 2:15", "Now when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, was come to go in unto the king, she required nothing but what Hegai the king’s eunuch, the keeper of the women, advised. And Esther obtained favor in the sight of all them that looked upon her."]], "back": "hegai"}, "crown": {"t": ["The king loves you above all the others and sets the royal crown on your head."], "v": [["Esther 2:17", "And the king loved Esther more than all the women, and she obtained grace and favor in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti."]], "c": [{"t": "Keep going", "go": "plot"}]}, "plot": {"t": ["Mordecai hears two of the king's doorkeepers plotting to kill the king. He tells you."], "c": [{"t": "Keep out of it", "go": "w_plot"}, {"t": "Warn the king in Mordecai's name", "go": "haman", "fx": {"cour": 1}}], "v": []}, "w_plot": {"wrong": true, "t": ["Esther told the king in Mordecai's name, and it was written in the king's records."], "v": [["Esther 2:22", "And the thing was known to Mordecai, who told it unto Esther the queen; and Esther informed the king of it in Mordecai’s name."], ["Esther 2:23", "And when inquiry was made into the matter, it was confirmed; therefore they were both hanged on a tree: and it was written in the book of the chronicles before the king."]], "back": "plot"}, "haman": {"t": ["Haman is made the highest prince. Mordecai will not bow to him, so Haman tricks the king into a law: on one day, every Jew in the kingdom will be killed.", "Mordecai begs you to go to the king. But anyone who goes in to the king without being called is put to death."], "v": [["Esther 3:13", "And the letters were sent by couriers into all the king’s provinces, to destroy, to kill, and to cause to perish, all Jews, both young and old, little children and women, in one day, even upon the thirteenth day of the twelfth month, which is the month Adar, and to take the spoil of them for a prey."]], "c": [{"t": "Stay safe; you are the queen", "go": "w_haman"}, {"t": "Listen to Mordecai", "go": "fast"}]}, "w_haman": {"wrong": true, "t": ["Mordecai warned her that she would not escape just because she lived in the palace."], "v": [["Esther 4:13", "Then Mordecai commanded to answer Esther, Think not to yourself that you shall escape in the king’s house, more than all the Jews."]], "back": "haman"}, "fast": {"t": ["Mordecai sends you an answer."], "v": [["Esther 4:14", "For if you altogether hold your peace at this time, then shall relief and deliverance arise to the Jews from another place; but you and your father’s house shall be destroyed: and who knows whether you are come to the kingdom for such a time as this?"]], "c": [{"t": "Ask all the Jews to fast three days for you", "go": "court", "fx": {"cour": 1}}]}, "court": {"t": ["On the third day you put on your royal robes and stand in the inner court. The king sits on his throne."], "v": [["Esther 4:16", "Go, gather together all the Jews that are present in Shushan, and fast for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish."]], "c": [{"t": "Wait until the king calls for you", "go": "w_court"}, {"t": "Go in to the king", "go": "scepter", "min": {"cour": 3}}]}, "w_court": {"wrong": true, "t": ["Esther did not wait. She went in, though it was against the law."], "v": [["Esther 4:16", "Go, gather together all the Jews that are present in Shushan, and fast for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish."]], "back": "court"}, "scepter": {"t": ["The king holds out the golden scepter. What is your request, he asks. It will be given you, even half of the kingdom."], "v": [["Esther 5:2", "And it was so, when the king saw Esther the queen standing in the court, that she obtained favor in his sight: and the king held out to Esther the golden scepter that was in his hand. So Esther drew near, and touched the top of the scepter."]], "c": [{"t": "Tell him everything right now", "go": "w_scepter"}, {"t": "Invite the king and Haman to a banquet", "go": "banquet", "fx": {"fav": 1}}]}, "w_scepter": {"wrong": true, "t": ["Esther waited, and invited the king and Haman to a banquet."], "v": [["Esther 5:4", "And Esther answered, If it seem good unto the king, let the king and Haman come this day unto the banquet that I have prepared for him."]], "back": "scepter"}, "banquet": {"t": ["Haman builds a gallows for Mordecai. But that night the king cannot sleep. He has the records read and learns that Mordecai saved his life, and Haman must honor Mordecai through the city.", "At your second banquet the king asks again for your request."], "v": [["Esther 6:1", "On that night the king could not sleep, and he commanded to be brought the book of records of the chronicles; and they were read before the king."]], "c": [{"t": "Ask only for your own life", "go": "w_banquet"}, {"t": "Ask for your life, and for your people", "go": "end"}]}, "w_banquet": {"wrong": true, "t": ["Esther asked for her life and for her people."], "v": [["Esther 7:3", "Then Esther the queen answered and said, If I have found favor in your sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request:"]], "back": "banquet"}, "end": {"end": true, "t": ["You tell the king who the enemy is: this wicked Haman. Haman is hanged on the gallows he built for Mordecai, and the Jews are allowed to defend themselves."], "v": [["Esther 7:10", "So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king’s wrath abated."], ["Esther 9:22", "As the days on which the Jews rested from their enemies, and the month which was turned unto them from sorrow to joy, and from mourning into a good day: that they should make them days of feast"]], "lesson": "Who knows whether you are come to the kingdom for such a time as this?"}}, "sol": [1, 1, 0, 1, 1, 0, 1, 1, 1], "losepath": [0, "back", 0]}, "adv_moses": {"name": "Moses, from Basket to Deliverer", "start": "start", "stats": [["rank", "Rank in Egypt", 0], ["faith", "Faith", 1]], "how": "Live the life of Moses in chapters, from a baby in a basket to the man God used to set Israel free. Watch your Rank in Egypt and your Faith. Choosing God's people costs rank but builds faith. The last door needs Faith 5.", "nodes": {"start": {"head": "Childhood", "t": ["Pharaoh has ordered every Hebrew baby boy thrown into the river. Your mother has hidden you for three months, but she cannot hide you any longer."], "v": [["Exodus 2:2", "And the woman conceived, and bore a son: and when she saw him that he was a fine child, she hid him three months."]], "c": [{"t": "She hands you over to Pharaoh's men", "go": "w_start"}, {"t": "She puts you in a basket among the reeds of the river", "go": "princess"}]}, "w_start": {"wrong": true, "t": ["Your parents were not afraid of the king's command."], "v": [["Hebrews 11:23", "By faith Moses, when he was born, was hid three months by his parents, because they saw he was a beautiful child; and they were not afraid of the king’s commandment."]], "back": "start"}, "princess": {"t": ["Pharaoh's daughter comes to wash at the river and finds you crying. She feels sorry for you. Your sister Miriam is watching."], "v": [["Exodus 2:6", "And when she had opened it, she saw the child: and, behold, the babe wept. And she had compassion on him, and said, This is one of the Hebrews’ children."]], "c": [{"t": "Miriam runs away scared", "go": "w_princess"}, {"t": "Miriam offers to find a Hebrew nurse", "go": "court"}]}, "w_princess": {"wrong": true, "t": ["Miriam spoke up, and the nurse she fetched was your own mother."], "v": [["Exodus 2:7", "Then said his sister to Pharaoh’s daughter, Shall I go and call to you a nurse of the Hebrew women, that she may nurse the child for you?"], ["Exodus 2:8", "And Pharaoh’s daughter said to her, Go. And the girl went and called the child’s mother."]], "back": "princess"}, "court": {"head": "Youth in Pharaoh's court", "t": ["You grow up as the son of Pharaoh's daughter, in the palace."], "v": [["Acts 7:22", "And Moses was learned in all the wisdom of the Egyptians, and was mighty in words and in deeds."]], "c": [{"t": "Learn all you can", "go": "grown", "fx": {"rank": 3}}]}, "grown": {"t": ["You are grown, a prince of Egypt. But you know who your people are, and you see their hard labor."], "c": [{"t": "Enjoy the pleasures of Egypt", "go": "w_grown"}, {"t": "Refuse to be called the son of Pharaoh's daughter", "go": "egyptian", "fx": {"rank": -2, "faith": 1}}], "v": []}, "w_grown": {"wrong": true, "t": ["Moses chose to suffer with God's people instead."], "v": [["Hebrews 11:24", "By faith Moses, when he was grown up, refused to be called the son of Pharaoh’s daughter;"], ["Hebrews 11:25", "Choosing rather to suffer affliction with the people of God, than to enjoy the pleasures of sin for a time;"]], "back": "grown"}, "egyptian": {"t": ["You see an Egyptian beating a Hebrew. You kill the Egyptian and hide him in the sand. The next day two Hebrews are fighting, and one says: Who made you a ruler over us? Will you kill me too?", "Pharaoh hears of it and seeks to kill you."], "v": [["Exodus 2:15", "Now when Pharaoh heard this thing, he sought to slay Moses. But Moses fled from the face of Pharaoh, and dwelt in the land of Midian: and he sat down by a well."]], "c": [{"t": "Stay and face Pharaoh", "go": "w_egyptian"}, {"t": "Flee to the land of Midian", "go": "midian", "fx": {"rank": -1}}]}, "w_egyptian": {"wrong": true, "t": ["Moses fled from Pharaoh."], "v": [["Exodus 2:15", "Now when Pharaoh heard this thing, he sought to slay Moses. But Moses fled from the face of Pharaoh, and dwelt in the land of Midian: and he sat down by a well."]], "back": "egyptian"}, "midian": {"head": "Exile in Midian", "t": ["You sit by a well. The seven daughters of the priest of Midian come to water their flock, but shepherds drive them away."], "c": [{"t": "Stay out of it; you are a stranger here", "go": "w_midian"}, {"t": "Stand up and help them", "go": "keep", "fx": {"faith": 1}}], "v": []}, "w_midian": {"wrong": true, "t": ["Moses stood up and helped them."], "v": [["Exodus 2:17", "And the shepherds came and drove them away: but Moses stood up and helped them, and watered their flock."]], "back": "midian"}, "keep": {"t": ["You marry Zipporah and become a shepherd. Forty years pass in the desert."], "v": [["Acts 7:30", "And when forty years were expired, there appeared to him in the wilderness of mount Sinai an angel of the Lord in a flame of fire in a bush."]], "c": [{"t": "Lead the flock to Horeb, the mountain of God", "go": "bush"}]}, "bush": {"head": "The calling", "t": ["A bush is burning with fire, yet it is not burned up."], "v": [["Exodus 3:2", "And the angel of the LORD appeared unto him in a flame of fire out of the midst of a bush: and he looked, and, behold, the bush burned with fire, and the bush was not consumed."]], "c": [{"t": "Walk on by", "go": "w_bush"}, {"t": "Turn aside to see this great sight", "go": "shoes"}]}, "w_bush": {"wrong": true, "t": ["Moses turned aside, and God called to hi
