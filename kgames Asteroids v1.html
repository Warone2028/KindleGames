<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kindle Asteroids v1</title>
<!--
  Kindle Asteroids v1
  Based on "Asteroids" by gamelabz (https://github.com/gamelabz/html5-game-asteroids), MIT License,
  Copyright (c) 2026 gamelabz. Rewritten in plain ES5 for the Kindle browser: black and white,
  on-screen hold buttons, and speed choices. The game keeps real time even when the screen
  updates slowly, so it never runs slower than the speed you choose.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Georgia, "Times New Roman", serif; font-size: 18px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 4px 6px; }
  .top { text-align: center; font-size: 22px; font-weight: bold; margin: 2px 0 4px; }
  table.hud { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  table.hud td { text-align: center; font-size: 18px; padding: 2px; }
  table.hud b { font-size: 20px; }
  canvas { display: block; width: 100%; border: 3px solid #000; box-sizing: border-box; background: #fff; touch-action: none; }
  .row { text-align: center; margin: 5px 0; white-space: nowrap; }
  .lbl { font-size: 18px; font-weight: bold; margin-right: 4px; }
  button { font-family: inherit; font-weight: bold; background: #fff; color: #000; border: 3px solid #000; border-radius: 8px; margin: 0 2px; padding: 0; touch-action: none; }
  button.on { background: #000; color: #fff; }
  .sp { font-size: 18px; width: 14.5%; height: 44px; margin: 0 1px; }
  .ctl { font-size: 18px; width: 31%; height: 44px; }
  .pad { font-size: 22px; height: 70px; }
  .w3 { width: 31%; }
  .w2 { width: 47%; }
  .msg { text-align: center; font-size: 18px; min-height: 24px; margin: 2px 0; }
  .help { font-size: 16px; text-align: center; margin: 4px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">Kindle Asteroids v1</div>
  <table class="hud"><tr>
    <td>Score <b id="score">0</b></td>
    <td>Lives <b id="lives">3</b></td>
    <td>Wave <b id="wave">1</b></td>
    <td>Best <b id="best">0</b></td>
  </tr></table>

  <canvas id="game" width="600" height="420"></canvas>
  <div class="msg" id="message">Tap Start to fly.</div>

  <div class="row">
    <button class="ctl" id="start">Start</button>
    <button class="ctl" id="restart">New game</button>
    <button class="ctl" id="auto">Auto-fire</button>
  </div>

  <div class="row">
    <span class="lbl">Speed</span>
    <button class="sp" data-speed="0.5">50%</button><button class="sp" data-speed="0.75">75%</button><button class="sp" data-speed="1">100%</button><button class="sp" data-speed="1.5">150%</button><button class="sp" data-speed="2">200%</button>
  </div>

  <div class="row">
    <button class="pad w3" data-key="ArrowLeft">Turn left</button><button class="pad w3" data-key="ArrowUp">Thrust</button><button class="pad w3" data-key="ArrowRight">Turn right</button>
  </div>
  <div class="row">
    <button class="pad w2" data-key=" ">Fire</button><button class="pad w2" id="jump">Jump</button>
  </div>

  <div class="help">Hold a button to keep turning, thrusting or firing. Jump moves the ship to a random spot. Auto-fire shoots by itself, so you only need to steer.</div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var waveEl = document.getElementById('wave');
  var bestEl = document.getElementById('best');
  var messageEl = document.getElementById('message');
  var startEl = document.getElementById('start');
  var restartEl = document.getElementById('restart');
  var autoEl = document.getElementById('auto');

  var W = canvas.width, H = canvas.height;
  var STEP = 1000 / 60;          // the original game moved once per 60th of a second
  var ship, bullets, rocks, particles, score, lives, wave, running, over, thrusting;
  var keys = {};
  var speed = 1, autoFire = false, best = 0;
  var acc = 0, last = 0;

  function store(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function dist(x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }

  function reset() {
    ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0, r: 14, cool: 0 };
    bullets = []; particles = []; rocks = [];
    score = 0; lives = 3; wave = 1; over = false;
    scoreEl.innerHTML = '0'; livesEl.innerHTML = '3'; waveEl.innerHTML = '1';
    spawnWave();
  }

  function spawnWave() {
    var i, x, y, ang, sp;
    for (i = 0; i < 3 + wave; i++) {
      do { x = Math.random() * W; y = Math.random() * H; }
      while (dist(x, y, ship.x, ship.y) < 140);
      ang = Math.random() * Math.PI * 2; sp = 0.6 + Math.random() * 0.8;
      rocks.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, size: 3, r: 38, seed: Math.floor(Math.random() * 5) });
    }
  }

  function newGame() {
    reset(); running = false; acc = 0;
    startEl.innerHTML = 'Start';
    messageEl.innerHTML = 'Tap Start to fly.';
    draw();
  }

  function burst(x, y) {
    var i, a, s;
    for (i = 0; i < 8; i++) {
      a = Math.random() * Math.PI * 2; s = Math.random() * 3 + 1;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 24 });
    }
  }

  function fire() {
    if (ship.cool > 0) return;
    ship.cool = 8;
    var sp = 7;
    bullets.push({ x: ship.x + Math.cos(ship.a) * ship.r, y: ship.y + Math.sin(ship.a) * ship.r,
      vx: Math.cos(ship.a) * sp + ship.vx, vy: Math.sin(ship.a) * sp + ship.vy, life: 60 });
  }

  function jump() {
    if (!running) return;
    ship.x = Math.random() * W; ship.y = Math.random() * H; ship.vx = 0; ship.vy = 0;
  }

  function split(rock) {
    var i, a, sp;
    if (rock.size > 1) {
      for (i = 0; i < 2; i++) {
        a = Math.random() * Math.PI * 2; sp = 1 + Math.random();
        rocks.push({ x: rock.x, y: rock.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: rock.size - 1, r: rock.r * 0.62, seed: Math.floor(Math.random() * 5) });
      }
    }
    burst(rock.x, rock.y);
    score += (4 - rock.size) * 20;
    scoreEl.innerHTML = String(score);
    if (score > best) { best = score; bestEl.innerHTML = String(best); store('kast_best', String(best)); }
  }

  function wrap(o) {
    if (o.x < 0) o.x += W; if (o.x > W) o.x -= W;
    if (o.y < 0) o.y += H; if (o.y > H) o.y -= H;
  }

  // One step of the original game (1/60 of a second of play).
  function update() {
    var i, j, b, r;
    if (keys['ArrowUp']) {
      thrusting = true;
      ship.vx += Math.cos(ship.a) * 0.12; ship.vy += Math.sin(ship.a) * 0.12;
    } else thrusting = false;
    if (keys['ArrowLeft']) ship.a -= 0.07;
    if (keys['ArrowRight']) ship.a += 0.07;
    if (keys[' '] || autoFire) fire();
    ship.vx *= 0.99; ship.vy *= 0.99;
    ship.x += ship.vx; ship.y += ship.vy; ship.cool--;
    wrap(ship);

    for (i = bullets.length - 1; i >= 0; i--) {
      b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life--; wrap(b);
      if (b.life <= 0) bullets.splice(i, 1);
    }
    for (i = 0; i < rocks.length; i++) { r = rocks[i]; r.x += r.vx; r.y += r.vy; wrap(r); }

    for (i = 0; i < bullets.length; i++) {
      b = bullets[i];
      for (j = rocks.length - 1; j >= 0; j--) {
        r = rocks[j];
        if (dist(b.x, b.y, r.x, r.y) < r.r) { rocks.splice(j, 1); split(r); b.life = 0; break; }
      }
    }
    for (i = bullets.length - 1; i >= 0; i--) if (bullets[i].life <= 0) bullets.splice(i, 1);

    for (i = rocks.length - 1; i >= 0; i--) {
      if (dist(ship.x, ship.y, rocks[i].x, rocks[i].y) < rocks[i].r + ship.r) {
        burst(ship.x, ship.y);
        lives--; livesEl.innerHTML = String(lives);
        rocks.splice(i, 1);
        if (lives <= 0) {
          running = false; over = true;
          startEl.innerHTML = 'Start';
          messageEl.innerHTML = 'Game over! Score ' + score + '. Tap New game.';
          return;
        }
        ship.x = W / 2; ship.y = H / 2; ship.vx = 0; ship.vy = 0;
        messageEl.innerHTML = 'Hit! ' + lives + (lives === 1 ? ' life' : ' lives') + ' left.';
      }
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (rocks.length === 0 && running) {
      wave++; waveEl.innerHTML = String(wave);
      messageEl.innerHTML = 'Wave ' + wave + '!';
      spawnWave();
    }
  }

  function draw() {
    var i, j, r, n, a, rr, px, py;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

    // ship
    if (!over) {
      ctx.save();
      ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
      if (thrusting && running) {
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.moveTo(-ship.r * 0.6, -6); ctx.lineTo(-ship.r - 12, 0); ctx.lineTo(-ship.r * 0.6, 6); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(ship.r + 4, 0); ctx.lineTo(-ship.r, -ship.r * 0.8); ctx.lineTo(-ship.r * 0.5, 0); ctx.lineTo(-ship.r, ship.r * 0.8);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // rocks: thick black outlines
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    for (j = 0; j < rocks.length; j++) {
      r = rocks[j];
      ctx.save(); ctx.translate(r.x, r.y);
      ctx.beginPath();
      n = 9;
      for (i = 0; i < n; i++) {
        a = (i / n) * Math.PI * 2;
        rr = r.r * (0.72 + 0.28 * (((i + r.seed) * 37) % 5) / 5);
        px = Math.cos(a) * rr; py = Math.sin(a) * rr;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }

    // bullets
    ctx.fillStyle = '#000';
    for (i = 0; i < bullets.length; i++) ctx.fillRect(bullets[i].x - 3, bullets[i].y - 3, 6, 6);

    // explosion bits
    for (i = 0; i < particles.length; i++) ctx.fillRect(particles[i].x - 2, particles[i].y - 2, 4, 4);

    if (!running) {
      ctx.fillStyle = '#000';
      ctx.font = 'bold 34px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(over ? 'GAME OVER' : 'Tap Start', W / 2, H / 2 - 50);
    }
  }

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (f) { return window.setTimeout(function () { f(new Date().getTime()); }, 16); };

  function now() { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); }

  // Real-time loop: however slowly the screen updates, the game catches up by running
  // enough steps for the time that passed, times the chosen speed.
  function loop() {
    var t = now(), dt = t - last, steps = 0;
    last = t;
    if (dt > 500) dt = 500;               // after a pause or sleep, don't jump far ahead
    if (running) {
      acc += dt * speed;
      while (acc >= STEP && steps < 120 && running) { update(); acc -= STEP; steps++; }
      if (steps >= 120) acc = 0;
    }
    draw();
    raf(loop);
  }

  // ---- controls ----
  function setSpeed(s) {
    speed = s;
    var bs = document.querySelectorAll('button.sp'), i;
    for (i = 0; i < bs.length; i++) bs[i].className = 'sp' + (parseFloat(bs[i].getAttribute('data-speed')) === s ? ' on' : '');
    store('kast_speed', String(s));
  }
  function setAuto(on) {
    autoFire = on;
    autoEl.className = 'ctl' + (on ? ' on' : '');
    autoEl.innerHTML = on ? 'Auto-fire on' : 'Auto-fire';
    store('kast_auto', on ? '1' : '0');
  }

  function press(btn, down) {
    var k = btn.getAttribute('data-key');
    keys[k] = down;
    btn.className = btn.className.replace(/ on/g, '') + (down ? ' on' : '');
  }

  function holdButton(btn) {
    btn.addEventListener('touchstart', function (e) { e.preventDefault(); press(btn, true); }, false);
    btn.addEventListener('touchend', function (e) { e.preventDefault(); press(btn, false); }, false);
    btn.addEventListener('touchcancel', function () { press(btn, false); }, false);
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); press(btn, true); }, false);
    btn.addEventListener('mouseup', function () { press(btn, false); }, false);
    btn.addEventListener('mouseleave', function () { press(btn, false); }, false);
  }

  function tapButton(btn, fn) {
    var touched = false;
    btn.addEventListener('touchstart', function (e) { e.preventDefault(); touched = true; fn(); }, false);
    btn.addEventListener('click', function () { if (touched) { touched = false; return; } fn(); }, false);
  }

  var pads = document.querySelectorAll('button[data-key]'), i;
  for (i = 0; i < pads.length; i++) holdButton(pads[i]);

  var sps = document.querySelectorAll('button.sp');
  for (i = 0; i < sps.length; i++) (function (b) {
    tapButton(b, function () { setSpeed(parseFloat(b.getAttribute('data-speed'))); });
  })(sps[i]);

  tapButton(document.getElementById('jump'), jump);
  tapButton(autoEl, function () { setAuto(!autoFire); });
  tapButton(startEl, function () {
    if (over) return;
    if (running) { running = false; startEl.innerHTML = 'Start'; messageEl.innerHTML = 'Paused. Tap Start to go on.'; }
    else { running = true; acc = 0; last = now(); startEl.innerHTML = 'Pause'; messageEl.innerHTML = 'Fly!'; }
  });
  tapButton(restartEl, newGame);

  window.addEventListener('keydown', function (e) {
    var k = e.key || '';
    if (k === 'Spacebar') k = ' ';
    keys[k] = true;
    if (k === 'Shift') jump();
    if (k === ' ' || k.indexOf('Arrow') === 0) e.preventDefault();
  }, false);
  window.addEventListener('keyup', function (e) { var k = e.key || ''; if (k === 'Spacebar') k = ' '; keys[k] = false; }, false);

  // let tests and the page check state
  window.KAST = { state: function () { return { running: running, over: over, score: score, lives: lives, wave: wave, rocks: rocks.length, speed: speed, ship: ship }; } };

  best = parseInt(load('kast_best') || '0', 10) || 0; bestEl.innerHTML = String(best);
  var s = parseFloat(load('kast_speed') || '1');
  setSpeed([0.5, 0.75, 1, 1.5, 2].indexOf(s) >= 0 ? s : 1);
  setAuto(load('kast_auto') === '1');
  newGame();
  last = now();
  raf(loop);
})();
</script>
</body>
</html>
