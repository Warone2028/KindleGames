          var d=o.d?0:1,r=o.d?o.r+i:o.r-j,c=o.d?o.c-j:o.c+i,s=can(w,r,c,d);

function solved(){for(var i=0;i<S.p.letters.length;i++){var L=S.p.letters[i];if(S.g[S.p.enc[L]]!==L)return false;}return true;}
function draw(){G.S=S;var p=S.p,h=G.bar('Bible Cryptogram',p.v.r+' &middot; hints left: '+S.hints);
  var words=p.t.split(' ');h+='<div class="crypt">';
  for(var w=0;w<words.length;w++){h+='<span class="cw2">';for(var i=0;i<words[w].length;i++){var ch=words[w].charAt(i);
      if(AL.indexOf(ch)<0){h+='<span class="cc"><span class="cg">'+esc(ch)+'</span><span class="ce">&nbsp;</span></span>';continue;}
      var e=p.enc[ch],gv=S.g[e]||'';h+='<span class="cc'+(S.sel===e?' on':'')+'" data-a="cl" data-v="'+e+'"><span class="cg">'+(gv||'_')+'</span><span class="ce">'+e+'</span></span>';}
    h+='</span> ';}
  h+='</div>';
  if(S.done){h+='<p class="note">You win! The verse is decoded'+(S.hints<3?' (with '+(3-S.hints)+' hint'+(S.hints===2?'':'s')+')':'')+'.</p><div class="avs">"'+esc(p.v.x)+'"<div class="avref">'+esc(p.v.r)+'</div></div><button class="btn dark" data-a="new">New verse</button>';}
  else{h+='<p class="small">'+(S.sel?'Code letter '+S.sel+' selected: tap the real letter.':'Tap a code letter (the small letter), then tap the real letter it stands for.')+'</p>'+G.keyboard(null,null);
    h+='<div class="row"><button class="btn" data-a="clear">Clear this letter</button><button class="btn'+(S.hints?'':' locked')+'" data-a="hint">Hint</button></div>'+(S.msg?'<p class="note">'+esc(S.msg)+'</p>':'');}
  S.el.innerHTML=h;}
G.add({id:id,name:'Bible Cryptogram',group:'Bible word games',start:function(el){S={el:el,p:make(),g:{},sel:null,hints:3,done:false,msg:''};draw();},
 click:function(a,v){if(a==='new'){this.start(S.el);return;}if(S.done)return;S.msg='';
  if(a==='cl')S.sel=v;
  else if(a==='key'){if(!S.sel)S.msg='First tap a code letter in the verse.';else{for(var k in S.g)if(S.g[k]===v&&k!==S.sel)delete S.g[k];S.g[S.sel]=v;}}
  else if(a==='clear'&&S.sel)delete S.g[S.sel];
  else if(a==='hint'&&S.hints){var miss=[];for(var i=0;i<S.p.letters.length;i++){var L=S.p.letters[i];if(S.g[S.p.enc[L]]!==L)miss.push(L);}
    if(miss.length){var L2=G.pick(miss);for(var k2 in S.g)if(S.g[k2]===L2)delete S.g[k2];S.g[S.p.enc[L2]]=L2;S.hints--;}}
  if(solved())S.done=true;draw();}});
G.HOW[id]='A KJ2000 verse is written in code: every letter stands for a different letter. Tap a code letter, then tap the real letter on the keyboard. The reference is shown to help you. You have 3 hints. Decode the whole verse to win.';
})();

/* ---------------- Word Ladder ---------------- */
(function(){
var S,id='wordladder',DICT={},LIST=WX.dict||[];for(var i=0;i<LIST.length;i++)DICT[LIST[i]]=1;
function nb(w){var o=[];for(var i=0;i<w.length;i++)for(var j=0;j<26;j++){var c=AL.charAt(j).toLowerCase();if(c===w.charAt(i))continue;var x=w.slice(0,i)+c+w.slice(i+1);if(DICT[x])o.push(x);}return o;}
function dist(a,b){var d={},q=[b];d[b]=0;while(q.length){var u=q.shift();if(u===a)return d[u];var n=nb(u);for(var i=0;i<n.length;i++)if(d[n[i]]===undefined){d[n[i]]=d[u]+1;q.push(n[i]);}}return 99;}
function options(){var n=nb(S.cur),good=[],other=[];for(var i=0;i<n.length;i++){if(S.path.indexOf(n[i])>=0)continue;(dist(n[i],S.end)<dist(S.cur,S.end)?good:other).push(n[i]);}
  var o=[];if(good.length)o.push(G.pick(good));o=o.concat(G.shuffle(other).slice(0,4-o.length));if(o.length<4)o=o.concat(G.shuffle(good).slice(1,1+4-o.length));return G.shuffle(o);}
function draw(){G.S=S;var h=G.bar('Bible Word Ladder','steps '+S.moves+' of '+S.max);
  h+='<p class="atext">Change <b>'+S.start.toUpperCase()+'</b> into <b>'+S.end.toUpperCase()+'</b>, one letter at a time. Every word is in the KJ2000 Bible.</p>';
  h+='<p class="atext center"><b>'+S.path.join(' &rarr; ').toUpperCase()+'</b></p>';
  if(S.cur===S.end)h+='<p class="note">You win! '+S.start.toUpperCase()+' became '+S.end.toUpperCase()+' in '+S.moves+' steps (best is '+S.best+').</p><button class="btn dark" data-a="new">New ladder</button>';
  else if(S.moves>=S.max)h+='<p class="note">Not yet: out of steps. A shortest way has '+S.best+' steps.</p><button class="btn dark" data-a="new">New ladder</button>';
  else{h+=S.opts.length?'<p class="small">Tap the next word:</p><div class="row">':'<p class="note">No new words from here. Tap Undo to go back.</p><div class="row">';for(var i=0;i<S.opts.length;i++)h+='<button class="btn" data-a="step" data-v="'+S.opts[i]+'">'+S.opts[i].toUpperCase()+'</button>';h+='</div>';
    if(S.path.length>1)h+='<button class="btn" data-a="undo">Undo</button>';}
  S.el.innerHTML=h;}
G.add({id:id,name:'Bible Word Ladder',group:'Bible word games',start:function(el){var L=G.pick(WX.lad);S={el:el,start:L[0],end:L[1],best:L[2],max:L[2]+4,cur:L[0],path:[L[0]],moves:0};S.opts=options();draw();},
 click:function(a,v){if(a==='new'){this.start(S.el);return;}if(S.cur===S.end||S.moves>=S.max)return;
  if(a==='step'&&S.opts.indexOf(v)>=0){S.moves++;S.path.push(v);S.cur=v;if(S.cur!==S.end)S.opts=options();}
  else if(a==='undo'&&S.path.length>1){S.path.pop();S.cur=S.path[S.path.length-1];S.opts=options();}
  draw();}});
G.HOW[id]='Change the first word into the goal word by changing one letter at a time. Tap one of the words offered for each step. Every word comes from the KJ2000 Bible. Reach the goal within the steps allowed to win. Undo takes back a word, but the step still counts.';
})();

/* ---------------- Odd One Out ---------------- */
(function(){
var S,id='oddoneout',GR=WX.groups||[];
function make(){var a=G.rnd(GR.length),b;do{b=G.rnd(GR.length);}while(b===a||GR[b][2]===GR[a][2]);
  var three=G.shuffle(GR[a][1].slice()).slice(0,3),odd;var c=G.shuffle(GR[b][1].slice());for(var i=0;i<c.length;i++)if(three.indexOf(c[i])<0){odd=c[i];break;}
  var o=G.shuffle(three.concat([odd]));return {o:o,odd:o.indexOf(odd),g:GR[a][0],og:GR[b][0],w:odd};}
function draw(){G.S=S;var h=G.bar('Bible Odd One Out',S.i<10?'round '+(S.i+1)+' of 10 &middot; right: '+S.score:'done');
  if(S.i>=10)h+=(S.score>=8?'<p class="note">You win! You got '+S.score+' of 10.</p>':'<p class="note">Not yet: you got '+S.score+' of 10. You need 8 to win.</p>')+'<button class="btn dark" data-a="new">New game</button>';
  else{h+='<p class="atext">Three of these belong together. Which one is the odd one out?</p>';
    if(S.fb===null){h+='<div class="row">';for(var i=0;i<4;i++)h+='<button class="btn" data-a="pick" data-v="'+i+'">'+esc(S.q.o[i])+'</button>';h+='</div>';}
    else h+='<p class="note">'+(S.fb?'Correct! ':'Wrong. ')+esc(S.q.w)+' is the odd one out. The other three are '+esc(S.q.g)+'; '+esc(S.q.w)+' belongs to '+esc(S.q.og)+'.</p><button class="btn dark" data-a="next">Next</button>';}
  S.el.innerHTML=h;}
G.add({id:id,name:'Bible Odd One Out',group:'Bible word games',start:function(el){S={el:el,i:0,score:0,fb:null,q:make()};draw();},
 click:function(a,v){if(a==='new'){this.start(S.el);return;}
  if(a==='pick'&&S.fb===null){S.fb=+v===S.q.odd;if(S.fb)S.score++;}
  else if(a==='next'&&S.fb!==null){S.i++;S.fb=null;if(S.i<10)S.q=make();}
  draw();}});
G.HOW[id]='Four Bible words are shown. Three belong to the same group, such as apostles, judges or plagues of Egypt. Tap the one that does not belong. Get 8 of 10 right to win.';
})();

/* ---------------- Quartets ---------------- */
(function(){
var S,id='quartets',GR=WX.groups||[];
function deal(){var pick=[],used={},o=G.shuffle(GR.slice());
  for(var i=0;i<o.length&&pick.length<7;i++){var ok=true;for(var j=0;j<4;j++)if(used[o[i][1][j]])ok=false;if(!ok)continue;pick.push(o[i]);for(j=0;j<4;j++)used[o[i][1][j]]=1;}
  var deck=[];for(i=0;i<pick.length;i++)for(j=0;j<4;j++)deck.push({w:pick[i][1][j],g:i});deck=G.shuffle(deck);
  return {sets:pick,me:deck.splice(0,7),cpu:deck.splice(0,7),pile:deck,mine:[],cpus:[]};}
function groupsIn(hand){var g={};for(var i=0;i<hand.length;i++)g[hand[i].g]=1;return g;}
function lay(who){var hand=S.d[who],cnt={},i;for(i=0;i<hand.length;i++)cnt[hand[i].g]=(cnt[hand[i].g]||0)+1;
  for(var g in cnt)if(cnt[g]===4){S.d[who==='me'?'mine':'cpus'].push(+g);S.d[who]=hand=hand.filter(function(c){return c.g!==+g;});S.log.push((who==='me'?'You lay down ':'The computer lays down ')+S.d.sets[g][0]+'.');}}
function refill(who){if(!S.d[who].length&&S.d.pile.length)S.d[who].push(S.d.pile.pop());}
function over(){return S.d.mine.length+S.d.cpus.length===S.d.sets.length;}
function cpuTurn(){var guard=0;while(!over()&&guard++<20){refill('cpu');var H=S.d.cpu;if(!H.length)return;
    var gs=groupsIn(H),want=[];for(var g in gs)for(var j=0;j<4;j++){var w=S.d.sets[g][1][j],has=false;for(var k=0;k<H.length;k++)if(H[k].w===w)has=true;if(!has)want.push({w:w,g:+g});}
    if(!want.length)return;var ask=G.pick(want),idx=-1;for(var m=0;m<S.d.me.length;m++)if(S.d.me[m].w===ask.w)idx=m;
    if(idx>=0){H.push(S.d.me.splice(idx,1)[0]);S.log.push('The computer asks you for '+ask.w+' and takes it.');lay('cpu');refill('me');continue;}
    S.log.push('The computer asks you for '+ask.w+'. You do not have it.');if(S.d.pile.length){H.push(S.d.pile.pop());lay('cpu');}return;}}
function draw(){G.S=S;var d=S.d,h=G.bar('Bible Quartets','your sets '+d.mine.length+' &middot; computer '+d.cpus.length+' &middot; pile '+d.pile.length);
  if(S.log.length)h+='<div class="note">'+esc(S.log.slice(-4).join(' '))+'</div>';S.log=[];
  if(over()){var a=d.mine.length,b=d.cpus.length;h+='<p class="note">'+(a>b?'You win! You collected '+a+' sets to '+b+'.':(a<b?'The computer wins, '+b+' sets to '+a+'.':'A tie, '+a+' sets each.'))+'</p><button class="btn dark" data-a="new">New game</button>';}
  else{h+='<p class="small">Your cards (computer has '+d.cpu.length+'):</p><div class="row">';
    var hand=d.me.slice().sort(function(x,y){return x.g-y.g;});for(var i=0;i<hand.length;i++)h+='<span class="btn" style="cursor:default">'+esc(hand[i].w)+' <span class="small">('+esc(d.sets[hand[i].g][0])+')</span></span>';h+='</div>';
    var gs=groupsIn(d.me),opts=[];for(var g in gs)for(var j=0;j<4;j++){var w=d.sets[g][1][j],has=false;for(var k=0;k<d.me.length;k++)if(d.me[k].w===w)has=true;if(!has)opts.push(w);}
    if(opts.length){h+='<p class="small">Ask the computer for a card you need:</p><div class="row">';for(var o=0;o<opts.length;o++)h+='<button class="btn" data-a="ask" data-v="'+esc(opts[o])+'">'+esc(opts[o])+'</button>';h+='</div>';}
    else h+='<button class="btn dark" data-a="pass">Draw a card</button>';
    if(d.mine.length)h+='<p class="small">Your sets: '+esc(d.mine.map(function(g){return d.sets[g][0];}).join(', '))+'</p>';}
  S.el.innerHTML=h;}
G.add({id:id,name:'Bible Quartets',group:'Bible word games',start:function(el){S={el:el,d:deal(),log:['Collect sets of four Bible things. You go first.']};lay('me');lay('cpu');draw();},
 click:function(a,v){if(a==='new'){this.start(S.el);return;}if(over())return;var d=S.d;
  if(a==='ask'){var idx=-1;for(var i=0;i<d.cpu.length;i++)if(d.cpu[i].w===v)idx=i;
    if(idx>=0){d.me.push(d.cpu.splice(idx,1)[0]);S.log.push('The computer has '+v+'. Your turn again.');lay('me');refill('cpu');refill('me');}
    else{S.log.push('The computer does not have '+v+'.');if(d.pile.length){var c=d.pile.pop();d.me.push(c);S.log.push('You draw '+c.w+'.');lay('me');}cpuTurn();refill('me');}}
  else if(a==='pass'){if(d.pile.length){var c2=d.pile.pop();d.me.push(c2);S.log.push('You draw '+c2.w+'.');lay('me');}cpuTurn();refill('me');}
  if(!over()&&!d.me.length&&!d.pile.length)cpuTurn();
  draw();}});
G.HOW[id]='Collect sets of four Bible things, like the four Gospels or four judges of Israel. On your turn, ask the computer for a card you need to finish a set you have started. If it has the card, you get it and go again. If not, you draw a card and the computer takes a turn. A full set of four is laid down. Collect the most sets to win.';
})();

/* ---------------- Mind Reader ---------------- */
(function(){
var S,id='mindreader',MR=WX.mind||{q:{},p:{}},NAMES=[];for(var n in MR.p)if(MR.p.hasOwnProperty(n))NAMES.push(n);NAMES.sort();
function has(n,k){return (' '+MR.p[n]+' ').indexOf(' '+k+' ')>=0;}
function miss(n){var m=0;for(var k in S.ans)if(S.ans.hasOwnProperty(k)&&has(n,k)!==S.ans[k])m++;return m;}
function ranked(){var r=[];for(var i=0;i<NAMES.length;i++)if(!S.no[NAMES[i]])r.push([miss(NAMES[i]),NAMES[i]]);r.sort(function(a,b){return a[0]-b[0]||(a[1]<b[1]?-1:1);});return r;}
function nextQ(){var r=ranked(),live=[];for(var i=0;i<r.length;i++)if(r[i][0]<=r[0][0])live.push(r[i][1]);
  if(live.length<=1||S.asked>=12)return null;
  var best=null,bs=-1;for(var k in MR.q){if(!MR.q.hasOwnProperty(k)||S.ans.hasOwnProperty(k)||S.skip[k])continue;var y=0;for(var j=0;j<live.length;j++)if(has(live[j],k))y++;var s=Math.min(y,live.length-y);if(s>bs){bs=s;best=k;}}
  return bs>0?best:null;}
function draw(){G.S=S;var h=G.bar('Bible Mind Reader',S.mode==='ask'?'question '+(S.asked+1):'');
  if(S.mode==='intro'){h+='<p class="atext">Think of a Bible person from this list, and the Kindle will try to read your mind with yes-or-no questions.</p><p class="small">'+esc(NAMES.join(', '))+'</p><button class="btn dark" data-a="go">I am ready</button>';}
  else if(S.mode==='ask'){h+='<p class="atext"><b>'+esc(MR.q[S.q])+'</b></p><div class="row"><button class="btn" data-a="ans" data-v="1">Yes</button><button class="btn" data-a="ans" data-v="0">No</button></div><button class="btn" data-a="ans" data-v="x">Not sure</button>';}
  else if(S.mode==='guess'){h+='<p class="atext">I think you are thinking of...</p><h2 class="center">'+esc(S.g)+'</h2><div class="row"><button class="btn" data-a="right">Yes, that is right</button><button class="btn" data-a="wrong">No</button></div>';}
  else if(S.mode==='got')h+='<p class="note">The Kindle read your mind: '+esc(S.g)+'! Think of someone else and try to stump it.</p><button class="btn dark" data-a="new">Play again</button>';
  else if(S.mode==='who'){h+='<p class="atext">Who were you thinking of?</p><div class="row">';for(var i=0;i<NAMES.length;i++)h+='<button class="btn" data-a="was" data-v="'+esc(NAMES[i])+'">'+esc(NAMES[i])+'</button>';h+='</div>';}
  else if(S.mode==='stumped')h+='<p class="note">You win! You stumped the Kindle with '+esc(S.was)+'.</p>'+(S.bad.length?'<p class="small">By its facts, your answers did not match on: '+esc(S.bad.join(' '))+'</p>':'')+'<button class="btn dark" data-a="new">Play again</button>';
  S.el.innerHTML=h;window.scrollTo(0,0);}
function advance(){S.q=nextQ();if(S.q)S.mode='ask';else{var r=ranked();S.g=r.length?r[0][1]:null;S.mode=S.g?'guess':'who';}}
G.add({id:id,name:'Bible Mind Reader',group:'Bible word games',start:function(el){S={el:el,mode:'intro',ans:{},skip:{},no:{},asked:0,tries:0};draw();},
 click:function(a,v){if(a==='new'){this.start(S.el);return;}
  if(a==='go'){advance();}
  else if(a==='ans'&&S.mode==='ask'){if(v==='x')S.skip[S.q]=1;else S.ans[S.q]=v==='1';S.asked++;advance();}
  else if(a==='right'&&S.mode==='guess')S.mode='got';
  else if(a==='wrong'&&S.mode==='guess'){S.no[S.g]=1;S.tries++;if(S.tries>=3)S.mode='who';else advance();}
  else if(a==='was'&&S.mode==='who'){S.was=v;S.bad=[];for(var k in S.ans)if(S.ans.hasOwnProperty(k)&&has(v,k)!==S.ans[k])S.bad.push(MR.q[k]);S.mode='stumped';}
  draw();}});
G.HOW[id]='Think of one of the Bible people listed. Answer the Kindle\'s yes-or-no questions honestly (Not sure skips a question). The Kindle gets three guesses. If it cannot find your person, you win.';
})();
})();
(function(){var k=["wordguess", "hangman", "crossword", "wordsearch", "anagrams", "cryptogram", "wordladder", "oddoneout", "quartets", "mindreader"],G=window.GS,o=[];for(var i=0;i<k.length;i++)for(var j=0;j<G.games.length;j++)if(G.games[j].id===k[i])o.push(G.games[j]);G.games=o;})();</script></body></html>
