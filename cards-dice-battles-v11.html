  var t=cpuShot();m+=' The computer fired at '+String.fromCharCode(65+Math.floor(t/N))+(t%N+1)+': '+(S.mine[t]?(sunk(S.mine,S.cshots,S.mine[t])?'hit and sunk.':'hit.'):'miss.');
  if(allSunk(S.mine,S.cshots)){S.over=true;m+=' Your fleet is sunk. The computer wins.';}
  S.msg=m;draw();}});
})();

/* ---------------- Solitaire (Klondike, draw one) ---------------- */
(function(){
var S;
function red(c){return c.s===1||c.s===2;}
function canFound(c,pile){return pile.length?pile[pile.length-1].s===c.s&&pile[pile.length-1].r===c.r-1:c.r===0;}
function canTab(c,pile){if(!pile.length)return c.r===12;var t=pile[pile.length-1];return t.up&&red(t)!==red(c)&&t.r===c.r+1;}
function cardHtml(c,sel){if(!c.up)return '<div class="sc back"></div>';return '<div class="sc'+(red(c)?' red':'')+(sel?' sel':'')+'">'+cardTxt(c)+'</div>';}
function draw(){G.S=S;
  var h=G.bar('Solitaire',S.moves+' moves')+'<div class="srow">';
  h+='<div class="spile" data-a="stock">'+(S.stock.length?'<div class="sc back">'+S.stock.length+'</div>':'<div class="sc empty">Turn</div>')+'</div>';
  var w=S.waste;h+='<div class="spile" data-a="waste">'+(w.length?cardHtml(w[w.length-1],S.sel&&S.sel.from==='w'):'<div class="sc empty"></div>')+'</div><div class="spile gap"></div>';
  for(var f=0;f<4;f++){var fp=S.found[f];h+='<div class="spile" data-a="found" data-v="'+f+'">'+(fp.length?cardHtml(fp[fp.length-1],false):'<div class="sc empty">'+SUITS[f]+'</div>')+'</div>';}
  h+='</div><div class="srow tab">';
  for(var t=0;t<7;t++){var p=S.tab[t];h+='<div class="spile col" data-a="tab" data-v="'+t+'">';if(!p.length)h+='<div class="sc empty"></div>';
    for(var k=0;k<p.length;k++){var sel=S.sel&&S.sel.from==='t'&&S.sel.t===t&&k>=S.sel.k;h+='<div class="stack-card" data-a="card" data-v="'+t+','+k+'">'+cardHtml(p[k],sel)+'</div>';}h+='</div>';}
  h+='</div><p class="small">Tap a card, then tap where it goes. Tap the deck to turn a card. Build down in alternating colors; build each suit up from A to K at the top.</p>';
  if(S.msg)h+='<p class="note">'+S.msg+'</p>';
  h+='<div class="row"><button class="btn" data-a="auto">Move cards up</button><button class="btn'+(S.won?' dark':'')+'" data-a="new">New deal</button></div>';
  S.el.innerHTML=h;
}
function selCards(){if(!S.sel)return [];if(S.sel.from==='w')return [S.waste[S.waste.length-1]];return S.tab[S.sel.t].slice(S.sel.k);}
function removeSel(){if(S.sel.from==='w')S.waste.pop();else{S.tab[S.sel.t].splice(S.sel.k);var p=S.tab[S.sel.t];if(p.length&&!p[p.length-1].up)p[p.length-1].up=true;}}
function checkWin(){var n=0;for(var f=0;f<4;f++)n+=S.found[f].length;if(n===52){S.won=true;S.msg='All cards are home. You win.';}}
function autoUp(){var moved=true,count=0;while(moved){moved=false;
    if(S.waste.length){var c=S.waste[S.waste.length-1];if(canFound(c,S.found[c.s])){S.found[c.s].push(S.waste.pop());moved=true;count++;continue;}}
    for(var t=0;t<7;t++){var p=S.tab[t];if(!p.length)continue;var d=p[p.length-1];if(d.up&&canFound(d,S.found[d.s])){S.found[d.s].push(p.pop());if(p.length&&!p[p.length-1].up)p[p.length-1].up=true;moved=true;count++;break;}}}
  return count;}
G.add({id:'solitaire',name:'Solitaire',group:'Board and card games',start:function(el){var d=deck();S={el:el,tab:[],found:[[],[],[],[]],waste:[],stock:[],sel:null,moves:0,msg:'',won:false};
  for(var t=0;t<7;t++){S.tab.push([]);for(var k=0;k<=t;k++){var c=d.pop();c.up=k===t;S.tab[t].push(c);}}
  while(d.length){var x=d.pop();x.up=true;S.stock.push(x);}draw();},
 click:function(a,v){
  if(a==='new'){this.start(S.el);return;}
  if(S.won)return;S.msg='';
  if(a==='stock'){S.sel=null;if(S.stock.length)S.waste.push(S.stock.pop());else{while(S.waste.length)S.stock.push(S.waste.pop());}S.moves++;}
  else if(a==='auto'){S.sel=null;var n=autoUp();S.msg=n?'Moved '+n+' card'+(n===1?'':'s')+' up.':'No cards can move up right now.';if(n)S.moves++;checkWin();}
  else if(a==='waste'){if(S.waste.length)S.sel=S.sel&&S.sel.from==='w'?null:{from:'w'};}
  else if(a==='card'){var p=v.split(','),t=+p[0],k=+p[1],c=S.tab[t][k];
    if(S.sel&&!(S.sel.from==='t'&&S.sel.t===t)){a='tab';v=String(t);}
    else if(c.up){S.sel=(S.sel&&S.sel.from==='t'&&S.sel.t===t&&S.sel.k===k)?null:{from:'t',t:t,k:k};}
  }
  if(a==='tab'&&S.sel){var cs=selCards(),dest=S.tab[+v];if(S.sel.from==='t'&&S.sel.t===+v){S.sel=null;}else if(canTab(cs[0],dest)){removeSel();for(var q=0;q<cs.length;q++)dest.push(cs[q]);S.moves++;S.sel=null;}else{S.msg='That card cannot go there.';S.sel=null;}}
  else if(a==='found'&&S.sel){var cs2=selCards();if(cs2.length===1&&canFound(cs2[0],S.found[cs2[0].s])){removeSel();S.found[cs2[0].s].push(cs2[0]);S.moves++;checkWin();}else S.msg='That card cannot go up yet.';S.sel=null;}
  draw();}});
})();
})();
(function(){var k=["solitaire", "blackjack", "battleship"],G=window.GS,o=[];for(var i=0;i<k.length;i++)for(var j=0;j<G.games.length;j++)if(G.games[j].id===k[i])o.push(G.games[j]);G.games=o;})();</script></body></html>
