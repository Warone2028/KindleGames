<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kindle Snake v1</title>
<!--
  Kindle Snake v1 — classic Snake written in plain ES5 for the Kindle browser.
  Black and white, big direction buttons (or swipe on the board), speed choices.
  The game keeps real time even when the screen updates slowly.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Georgia, "Times New Roman", serif; font-size: 18px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 4px 6px; }
  .top { text-align: center; font-size: 22px; font-weight: bold; margin: 2px 0 4px; }
  table.hud { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  table.hud td { text-align: center; font-size: 18px; padding: 2px; }
  table.hud b { font-size: 20px; }
  canvas { display: block; width: 100%; border: 3px solid #000; box-sizing: border-box; background: #fff; touch-action: none; }
  .row { text-align: center; margin: 5px 0; white-space: nowrap; }
  .lbl { font-size: 18px; font-weight: bold; margin-right: 4px; }
  button { font-family: inherit; font-weight: bold; background: #fff; color: #000; border: 3px solid #000; border-radius: 8px; margin: 0 2px; padding: 0; touch-action: none; }
  button.on { background: #000; color: #fff; }
  .sp { font-size: 18px; width: 14.5%; height: 44px; margin: 0 1px; }
  .ctl { font-size: 18px; width: 31%; height: 44px; }
  .pad { font-size: 22px; height: 64px; width: 31%; }
  .msg { text-align: center; font-size: 18px; min-height: 24px; margin: 2px 0; }
  .help { font-size: 16px; text-align: center; margin: 4px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">Kindle Snake v1</div>
  <table class="hud"><tr>
    <td>Score <b id="score">0</b></td>
    <td>Length <b id="len">3</b></td>
    <td>Best <b id="best">0</b></td>
  </tr></table>

  <canvas id="game" width="600" height="390"></canvas>
  <div class="msg" id="message">Tap Start, or tap an arrow to begin.</div>

  <div class="row">
    <button class="ctl" id="start">Start</button>
    <button class="ctl" id="restart">New game</button>
    <button class="ctl" id="walls">Walls on</button>
  </div>

  <div class="row">
    <span class="lbl">Speed</span>
    <button class="sp" data-speed="0.5">50%</button><button class="sp" data-speed="0.75">75%</button><button class="sp" data-speed="1">100%</button><button class="sp" data-speed="1.5">150%</button><button class="sp" data-speed="2">200%</button>
  </div>

  <div class="row"><button class="pad" data-dir="up">Up</button></div>
  <div class="row">
    <button class="pad" data-dir="left">Left</button><button class="pad" data-dir="down">Down</button><button class="pad" data-dir="right">Right</button>
  </div>

  <div class="help">Eat the rings to grow. Don't hit yourself. With Walls on, the edges end the game; with Walls off, you come out the other side. You can also swipe on the board.</div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var lenEl = document.getElementById('len');
  var bestEl = document.getElementById('best');
  var messageEl = document.getElementById('message');
  var startEl = document.getElementById('start');
  var restartEl = document.getElementById('restart');
  var wallsEl = document.getElementById('walls');

  var CELL = 30, COLS = 20, ROWS = 13;      // 600 x 390 board
  var BASE_MOVES = 8;                       // moves per second at 100%
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var snake, dir, queue, food, score, running, over, grow;
  var speed = 1, walls = true, best = 0, acc = 0, last = 0;

  function store(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function now() { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); }

  function newGame() {
    var cy = Math.floor(ROWS / 2);
    snake = [{ x: 6, y: cy }, { x: 5, y: cy }, { x: 4, y: cy }];
    dir = 'right'; queue = []; score = 0; grow = 0; running = false; over = false; acc = 0;
    placeFood();
    scoreEl.innerHTML = '0'; lenEl.innerHTML = '3';
    startEl.innerHTML = 'Start';
    messageEl.innerHTML = 'Tap Start, or tap an arrow to begin.';
    draw();
  }

  function occupied(x, y) {
    for (var i = 0; i < snake.length; i++) if (snake[i].x === x && snake[i].y === y) return true;
    return false;
  }

  function placeFood() {
    var free = [], x, y;
    for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) if (!occupied(x, y)) free.push({ x: x, y: y });
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function opposite(a, b) { return DIRS[a][0] === -DIRS[b][0] && DIRS[a][1] === -DIRS[b][1]; }

  // Turns are queued and used one per move, so two quick taps never turn the snake back into itself.
  function turn(d) {
    var lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (d === lastDir || opposite(d, lastDir)) return;
    if (queue.length < 3) queue.push(d);
    if (!running && !over) begin();
  }

  function begin() {
    if (over) return;
    running = true; acc = 0; last = now();
    startEl.innerHTML = 'Pause';
    messageEl.innerHTML = 'Go!';
  }

  function endGame(why) {
    running = false; over = true;
    startEl.innerHTML = 'Start';
    messageEl.innerHTML = why + ' Score ' + score + '. Tap New game.';
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var head = snake[0];
    var nx = head.x + DIRS[dir][0], ny = head.y + DIRS[dir][1];
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      if (walls) { endGame('You hit the wall!'); return; }
      nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS;
    }
    // the tail moves out of the way this turn unless the snake is growing
    var tailMoves = grow === 0;
    for (var i = 0; i < snake.length - (tailMoves ? 1 : 0); i++) {
      if (snake[i].x === nx && snake[i].y === ny) { endGame('You ran into yourself!'); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (grow > 0) grow--; else snake.pop();

    if (food && nx === food.x && ny === food.y) {
      score += 10; grow += 1;
      scoreEl.innerHTML = String(score);
      if (score > best) { best = score; bestEl.innerHTML = String(best); store('ksnake_best', String(best)); }
      placeFood();
      if (!food) { endGame('You filled the whole board!'); }
    }
    lenEl.innerHTML = String(snake.length + grow);
  }

  function draw() {
    var i, s;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // food: a thick ring
    if (food) {
      ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 6, 0, Math.PI * 2, false);
      ctx.stroke();
    }

    // snake: solid squares with a small gap
    ctx.fillStyle = '#000';
    for (i = snake.length - 1; i >= 0; i--) {
      s = snake[i];
      ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
    }
    // eyes on the head
    s = snake[0];
    ctx.fillStyle = '#fff';
    var ex = DIRS[dir][0], ey = DIRS[dir][1];
    var cx = s.x * CELL + CELL / 2 + ex * 5, cy = s.y * CELL + CELL / 2 + ey * 5;
    ctx.fillRect(cx - ey * 6 - 3, cy - ex * 6 - 3, 6, 6);
    ctx.fillRect(cx + ey * 6 - 3, cy + ex * 6 - 3, 6, 6);

    if (!running) {
      ctx.fillStyle = '#fff'; ctx.fillRect(canvas.width / 2 - 150, 20, 300, 50);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(canvas.width / 2 - 150, 20, 300, 50);
      ctx.fillStyle = '#000'; ctx.font = 'bold 30px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText(over ? 'GAME OVER' : (score ? 'Paused' : 'Tap Start'), canvas.width / 2, 56);
    }
  }

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (f) { return window.setTimeout(function () { f(now()); }, 16); };

  // Real-time loop: however slowly the screen redraws, the snake makes the right number of moves.
  function loop() {
    var t = now(), dt = t - last, moves = 0, stepMs = 1000 / (BASE_MOVES * speed);
    last = t;
    if (dt > 500) dt = 500;
    if (running) {
      acc += dt;
      while (acc >= stepMs && running && moves < 20) { step(); acc -= stepMs; moves++; }
      if (moves >= 20) acc = 0;
    }
    draw();
    raf(loop);
  }

  // ---- controls ----
  function tapButton(btn, fn) {
    var touched = false;
    btn.addEventListener('touchstart', function (e) { e.preventDefault(); touched = true; fn(); }, false);
    btn.addEventListener('click', function () { if (touched) { touched = false; return; } fn(); }, false);
  }

  function setSpeed(s) {
    speed = s;
    var bs = document.querySelectorAll('button.sp'), i;
    for (i = 0; i < bs.length; i++) bs[i].className = 'sp' + (parseFloat(bs[i].getAttribute('data-speed')) === s ? ' on' : '');
    store('ksnake_speed', String(s));
  }
  function setWalls(on) {
    walls = on;
    wallsEl.innerHTML = on ? 'Walls on' : 'Walls off';
    wallsEl.className = 'ctl' + (on ? ' on' : '');
    store('ksnake_walls', on ? '1' : '0');
  }

  var pads = document.querySelectorAll('button[data-dir]'), i;
  for (i = 0; i < pads.length; i++) (function (b) {
    tapButton(b, function () { turn(b.getAttribute('data-dir')); });
  })(pads[i]);

  var sps = document.querySelectorAll('button.sp');
  for (i = 0; i < sps.length; i++) (function (b) {
    tapButton(b, function () { setSpeed(parseFloat(b.getAttribute('data-speed'))); });
  })(sps[i]);

  tapButton(wallsEl, function () { setWalls(!walls); });
  tapButton(restartEl, newGame);
  tapButton(startEl, function () {
    if (over) return;
    if (running) { running = false; startEl.innerHTML = 'Start'; messageEl.innerHTML = 'Paused. Tap Start to go on.'; }
    else begin();
  });

  // swipe on the board
  var sx = null, sy = null;
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, false);
  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (sx === null) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 'right' : 'left'); else turn(dy > 0 ? 'down' : 'up');
  }, false);

  window.addEventListener('keydown', function (e) {
    var k = e.key || '';
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Up: 'up', Down: 'down', Left: 'left', Right: 'right' };
    if (map[k]) { e.preventDefault(); turn(map[k]); }
  }, false);

  window.KSNAKE = { state: function () { return { running: running, over: over, score: score, length: snake.length, head: snake[0], dir: dir, food: food, speed: speed, walls: walls }; } };

  best = parseInt(load('ksnake_best') || '0', 10) || 0; bestEl.innerHTML = String(best);
  var s = parseFloat(load('ksnake_speed') || '1');
  setSpeed([0.5, 0.75, 1, 1.5, 2].indexOf(s) >= 0 ? s : 1);
  setWalls(load('ksnake_walls') !== '0');
  newGame();
  last = now();
  raf(loop);
})();
</script>
</body>
</html>
