function make(){for(;;){var a=1+G.rnd(99),b=1+G.rnd(99),op=G.pick(['+','-','*','/']),c;

(function(){

function win(b){for(var i=0;i<8;i++){var l=L[i];if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]];}return b.indexOf('')<0?'draw':null;}
function mm(b,p){var w=win(b);if(w==='O')return 1;if(w==='X')return -1;if(w==='draw')return 0;var best=p==='O'?-2:2;
  for(var i=0;i<9;i++)if(!b[i]){b[i]=p;var s=mm(b,p==='O'?'X':'O');b[i]='';if(p==='O'?s>best:s<best)best=s;}return best;}

/* ---------------- Connect Four ---------------- */
(function(){
var S,R=6,C=7;
function drop(b,c,p){for(var r=R-1;r>=0;r--)if(!b[r*C+c]){b[r*C+c]=p;return r;}return -1;}
function lift(b,c){for(var r=0;r<R;r++)if(b[r*C+c]){b[r*C+c]='';return;}}
function winner(b){var D=[[0,1],[1,0],[1,1],[1,-1]];for(var r=0;r<R;r++)for(var c=0;c<C;c++){var p=b[r*C+c];if(!p)continue;
    for(var d=0;d<4;d++){var k;for(k=1;k<4;k++){var rr=r+D[d][0]*k,cc=c+D[d][1]*k;if(rr<0||rr>=R||cc<0||cc>=C||b[rr*C+cc]!==p)break;}if(k===4)return p;}}
  for(var i=0;i<R*C;i++)if(!b[i])return null;return 'draw';}
function evalb(b){var s=0;for(var r=0;r<R;r++){if(b[r*C+3]==='O')s+=3;else if(b[r*C+3]==='X')s-=3;}return s;}
function nega(b,depth,p,alpha,beta){var w=winner(b);if(w==='O')return 1000+depth;if(w==='X')return -1000-depth;if(w==='draw')return 0;if(!depth)return evalb(b);

  var worst=1e9;for(i=0;i<7;i++){c=order[i];if(b[c])continue;drop(b,c,'X');s=nega(b,depth-1,'O',alpha,beta);lift(b,c);if(s<worst)worst=s;if(worst<beta)beta=worst;if(alpha>=beta)break;}return worst;}
function cpu(){var free=[];for(var c=0;c<C;c++)if(!S.b[c])free.push(c);var pick=free[0],best=-1e9,depth=S.who==='easy'?2:S.who==='medium'?3:5;
  G.shuffle(free);for(var i=0;i<free.length;i++){drop(S.b,free[i],'O');var s=nega(S.b,depth,'X',-1e9,1e9);lift(S.b,free[i]);if(s>best){best=s;pick=free[i];}}
  drop(S.b,pick,'O');S.last=pick;}
function draw(){G.S=S;
  var sz=Math.min(G.cell(7),80),w=winner(S.b),h=G.bar('Connect Four',S.who==='two'?'two players':'you are black')+'<p class="small">Tap a column to drop a disc. Get four in a row.</p><table class="grid c4">';

  h+='</table><p class="note center">'+(w==='draw'?'A draw.':w?(S.who==='two'?(w==='X'?'Black':'White')+' wins.':(w==='X'?'You win.':'The computer wins.')):((S.turn==='X'?'Black':'White')+' to play.'+(S.last!=null&&S.who!=='two'?' The computer played column '+(S.last+1)+'.':'')))+'</p>';
  h+='<div class="row"><button class="btn'+(w?' dark':'')+'" data-a="again">Play again</button><button class="btn" data-a="menu">Change opponent</button></div>';
  S.el.innerHTML=h;
}

(function(){

function moves(b,p){var m=[];for(var i=0;i<64;i++)if(flips(b,i,p).length)m.push(i);return m;}
function play(i,p){var f=flips(S.b,i,p);S.b[i]=p;for(var k=0;k<f.length;k++)S.b[f[k]]=p;}
function count(p){var n=0;for(var i=0;i<64;i++)if(S.b[i]===p)n++;return n;}

      h+='<td style="width:'+sz+'px;height:'+sz+'px" data-a="cell" data-v="'+i+'">'+t+'</td>';}h+='</tr>';}
  h+='</table><p class="small">Small dots show where you can play.</p>';
  var m=S.msg||'';if(S.over)m+=' Game over: '+(x>o?(S.who==='two'?'Black wins.':'You win.'):x<o?(S.who==='two'?'White wins.':'The computer wins.'):'A draw.');

G.add({id:'reversi',name:'Reversi',group:'Board and card games',start:function(el){S={el:el};picker(el,'Reversi','','<p>You play black and go first. Trap white discs between yours to turn them black.</p>');},
 click:function(a,v){
